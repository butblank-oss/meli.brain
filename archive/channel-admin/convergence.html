<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<title>맬리 어드민 수렴 구조</title>
<style>
:root{
  --brand-50:#E7F9F1; --brand-100:#C6F2E0; --brand-200:#6BDCAF;
  --brand-400:#13BD7E; --brand-700:#077A50; --brand-900:#043528;
  --g25:#FCFCFD; --g50:#F9FAFB; --g100:#F2F4F7; --g200:#EAECF0; --g300:#D0D5DD;
  --g400:#98A2B3; --g500:#667085; --g700:#344054; --g900:#101828;
  --page:#F7F8FA; --card:#FFFFFF;
  --neu-bg:#F2F4F7; --neu-fg:#475467; --neu-dot:#98A2B3;
  --ok-bg:#ECFDF3;  --ok-fg:#067647;  --ok-dot:#17B26A;
  --warn-bg:#FFFAEB;--warn-fg:#B54708;--warn-dot:#F79009;
  --dan-bg:#FEF3F2; --dan-fg:#B42318; --dan-dot:#F04438;
  --info-bg:#EFF8FF;--info-fg:#175CD3;--info-dot:#2E90FA;
  --hair:1px solid #EAECF0;
  --sh-card:0 1px 2px rgba(16,24,40,.04);
  --sh-pop:0 4px 16px rgba(16,24,40,.08);
  --sh-modal:0 24px 48px -12px rgba(16,24,40,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--page); color:var(--g900);
  font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  font-size:14px; line-height:1.5; letter-spacing:-.011em;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--brand-400);outline-offset:2px}
table{border-collapse:collapse;width:100%}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ── 뼈대 ── */
.app{display:flex;min-height:100vh}
.side{width:240px;flex:none;background:#fff;border-right:var(--hair);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-h{padding:16px 18px 14px;border-bottom:var(--hair)}
.brand{font-size:15px;font-weight:700;letter-spacing:-.024em}
.brand-sub{font-size:12.5px;color:var(--g500);margin-top:2px}
.surface-tag{display:inline-flex;align-items:center;gap:5px;margin-top:9px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:-.004em}
.surface-tag[data-s=manager]{background:var(--brand-50);color:var(--brand-700)}
.surface-tag[data-s=admin]{background:var(--info-bg);color:var(--info-fg)}
.nav{flex:1;overflow-y:auto;padding:12px 10px 18px}
.nav-grp{margin-top:14px}
.nav-grp:first-child{margin-top:2px}
.nav-grp-t{font-size:11.5px;font-weight:600;color:var(--g400);padding:0 8px 6px}
.nav-i{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 8px;border-radius:8px;font-size:13.5px;color:var(--g700);text-align:left}
.nav-i:hover{background:var(--g50)}
.nav-i[aria-current=page]{background:var(--brand-50);color:var(--brand-700);font-weight:600}
.nav-i.locked{color:var(--g400);cursor:not-allowed}
.nav-i.locked:hover{background:none}
.nav-ico{width:16px;flex:none;color:var(--g400)}
.nav-i[aria-current=page] .nav-ico{color:var(--brand-700)}
.nav-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{height:18px;min-width:18px;padding:0 5px;border-radius:6px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.pill.n{background:var(--g100);color:var(--neu-fg)}
.pill.c{background:var(--dan-bg);color:var(--dan-fg)}
.pill.ro{background:var(--g100);color:var(--g400);font-size:11px}
.side-f{padding:10px;border-top:var(--hair)}
.acct{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;width:100%;text-align:left}
.acct:hover{background:var(--g50)}
.avatar{width:28px;height:28px;border-radius:999px;background:var(--brand-50);color:var(--brand-700);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.acct-n{font-size:13px;font-weight:600;line-height:1.3}
.acct-r{font-size:12px;color:var(--g500);line-height:1.3}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:60px;flex:none;background:#fff;border-bottom:var(--hair);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
.top-t{font-size:15px;font-weight:700;letter-spacing:-.024em}
.top-crumb{font-size:12.5px;color:var(--g500)}
.spacer{flex:1}
.seg{display:flex;background:var(--g100);border-radius:8px;padding:3px;gap:2px}
.seg button{height:28px;padding:0 11px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--g500)}
.seg button[aria-pressed=true]{background:#fff;color:var(--g900);box-shadow:var(--sh-card)}
.body{padding:20px 24px 40px;max-width:1440px;width:100%}

/* ── 표면 ── */
.card{background:var(--card);border:var(--hair);border-radius:10px;box-shadow:var(--sh-card)}
.card-h{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:var(--hair)}
.card-t{font-size:16px;font-weight:700;letter-spacing:-.024em}
.card-d{font-size:12.5px;color:var(--g500)}
.card-b{padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>*{flex:1;min-width:280px}

h2.sec{font-size:20px;font-weight:700;letter-spacing:-.032em}
.sec-d{font-size:13px;color:var(--g500);margin-top:4px;max-width:62ch}

/* ── 탭 ── */
.tabs{display:flex;gap:2px;border-bottom:var(--hair);padding:0 20px;overflow-x:auto}
.tab{height:40px;padding:0 12px;font-size:13.5px;color:var(--g500);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab[aria-selected=true]{color:var(--brand-700);font-weight:600;border-bottom-color:var(--brand-400)}
.tab-note{padding:11px 20px;font-size:12.5px;color:var(--g500);background:var(--g25);border-bottom:var(--hair)}

/* ── 필터 ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:var(--hair)}
.fld{height:34px;border:1px solid var(--g300);border-radius:8px;background:#fff;padding:0 10px;font-size:13px;box-shadow:var(--sh-card)}
.fld::placeholder{color:var(--g400)}
.chip{height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--g300);background:#fff;font-size:12.5px;color:var(--g700);display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed=true]{background:var(--brand-50);border-color:var(--brand-200);color:#065C3D;font-weight:600}
.chip-x{color:var(--g400);font-size:14px;line-height:1}
.applied{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 20px 14px}
.applied-l{font-size:12.5px;color:var(--g500)}

/* ── 버튼 ── */
.btn{height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--g300);background:#fff;font-size:13px;font-weight:500;box-shadow:var(--sh-card);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--g50)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.pri{background:var(--brand-400);border-color:var(--brand-400);color:var(--brand-900);font-weight:600}
.btn.pri:hover{background:#10a96f}
.btn.qui{border-color:transparent;box-shadow:none;color:var(--g700)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── 표 ── */
.tw{overflow-x:auto}
thead th{height:38px;background:var(--g25);border-bottom:var(--hair);font-size:12.5px;font-weight:600;color:var(--g500);text-align:left;padding:0 14px;white-space:nowrap}
thead th.num{text-align:right}
tbody td{height:44px;border-bottom:1px solid var(--g100);padding:0 14px;font-size:13.5px;white-space:nowrap}
tbody tr:hover{background:var(--g50)}
tbody tr.revealed{background:var(--warn-bg)}
tbody tr.revealed:hover{background:#FFF6DC}
tbody tr.muted td{color:var(--g400)}
.sortable{cursor:pointer;user-select:none}
.sortable .arw{color:var(--g300);margin-left:3px}
.sortable[data-dir] .arw{color:var(--brand-400)}
.sub{font-size:12px;color:var(--g500);display:block;line-height:1.3}
.mono{font-variant-numeric:tabular-nums}

.tag{height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:-.004em;display:inline-flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:999px;flex:none}
.t-neu{background:var(--neu-bg);color:var(--neu-fg)} .t-neu .dot{background:var(--neu-dot)}
.t-ok{background:var(--ok-bg);color:var(--ok-fg)}    .t-ok .dot{background:var(--ok-dot)}
.t-warn{background:var(--warn-bg);color:var(--warn-fg)} .t-warn .dot{background:var(--warn-dot)}
.t-dan{background:var(--dan-bg);color:var(--dan-fg)}  .t-dan .dot{background:var(--dan-dot)}
.t-info{background:var(--info-bg);color:var(--info-fg)} .t-info .dot{background:var(--info-dot)}

.tfoot{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:var(--hair);font-size:12.5px;color:var(--g500);flex-wrap:wrap}

/* ── 지표 ── */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.metric{background:#fff;border:var(--hair);border-radius:10px;padding:16px 18px;box-shadow:var(--sh-card)}
.metric-l{font-size:13px;font-weight:500;color:var(--g500);display:flex;align-items:center;gap:6px}
.metric-v{font-size:28px;font-weight:700;letter-spacing:-.04em;margin-top:6px;line-height:1.1}
.metric-s{font-size:12.5px;color:var(--g500);margin-top:3px}
.metric-v.warn{color:var(--warn-fg)} .metric-v.dan{color:var(--dan-fg)}

/* ── 변화 표기 (제니코그 패턴, 우리 색규칙 적용) ── */
.delta{font-size:12.5px;margin-left:6px;color:var(--g500);font-variant-numeric:tabular-nums}
.delta.down{color:var(--warn-fg);font-weight:600}
.delta.flat{color:var(--g400)}

/* ── 차트 ── */
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding:0 4px}
.bargrp{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%}
.bar-pair{flex:1;display:flex;align-items:flex-end;gap:6px;width:100%;justify-content:center}
.bar{width:34px;border-radius:6px 6px 0 0;position:relative;display:flex;justify-content:center}
.bar span{position:absolute;top:-19px;font-size:12px;font-weight:600;color:var(--g700)}
.bar.pre{background:var(--g200)}
.bar.post{background:var(--brand-400)}
.bar.post span{color:var(--brand-700)}
.bargrp-l{font-size:12.5px;color:var(--g500);text-align:center}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--g500);align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ── 구조 화면 ── */
.mapgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:0 18px;align-items:center}
.mapgrid>div{padding:9px 0;border-bottom:1px solid var(--g100)}
.mapgrid>div:nth-last-child(-n+3){border-bottom:none}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--g50);border:var(--hair);border-radius:6px;padding:2px 7px;display:inline-block;letter-spacing:0}
.arrow{color:var(--g300);font-size:15px;text-align:center}
pre.json{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.65;background:var(--g25);border:var(--hair);border-radius:10px;padding:16px 18px;overflow-x:auto;letter-spacing:0;color:var(--g700)}
pre.json b{color:var(--brand-700);font-weight:600}
pre.json i{color:var(--info-fg);font-style:normal}
.note{border-left:3px solid var(--brand-200);background:var(--brand-50);border-radius:0 8px 8px 0;padding:12px 16px;font-size:13px;color:#065C3D}
.note.info{border-left-color:var(--info-dot);background:var(--info-bg);color:var(--info-fg)}
.kv{display:grid;grid-template-columns:132px 1fr;gap:10px 16px;font-size:13.5px}
.kv dt{color:var(--g500)}
.decide{display:grid;grid-template-columns:26px 1fr;gap:12px 12px;align-items:start}
.decide-n{width:24px;height:24px;border-radius:6px;background:var(--g100);color:var(--g700);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.decide-t{font-size:14px;font-weight:600}
.decide-d{font-size:13px;color:var(--g500);margin-top:3px}

/* ── 빈 상태 ── */
.empty{text-align:center;padding:44px 20px;color:var(--g500)}
.empty-t{font-size:14px;font-weight:600;color:var(--g700)}
.empty-d{font-size:13px;margin:5px 0 14px}

/* ── 모달 ── */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.42);display:none;align-items:center;justify-content:center;padding:24px;z-index:60}
.scrim.on{display:flex}
.modal{background:#fff;border-radius:12px;box-shadow:var(--sh-modal);width:100%;max-width:460px;max-height:86vh;overflow-y:auto}
.modal-h{display:flex;align-items:center;padding:18px 20px 0}
.modal-t{font-size:16px;font-weight:700;letter-spacing:-.024em;flex:1}
.modal-b{padding:14px 20px 4px;display:flex;flex-direction:column;gap:13px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:16px 20px 18px}
.lbl{font-size:13px;font-weight:500;display:block;margin-bottom:6px}
.req{color:var(--dan-fg)}
.modal-b select.fld,.modal-b input.fld,.modal-b textarea.fld{width:100%}
textarea.fld{height:auto;padding:9px 10px;resize:vertical;min-height:64px;font-size:13px}
.filters select.fld{max-width:220px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--g700);cursor:pointer}
.chk input{margin-top:2px;accent-color:var(--brand-400);width:15px;height:15px}
.hint{font-size:12.5px;color:var(--g500)}
.err{font-size:12.5px;color:var(--dan-fg);display:none}
.err.on{display:block}
.opt-grp{font-size:12px;color:var(--g400)}

/* ── 토스트 ── */
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--g900);color:#fff;border-radius:8px;padding:11px 15px;font-size:13px;box-shadow:var(--sh-pop);display:flex;align-items:center;gap:12px}
.toast button{color:var(--brand-200);font-weight:600;font-size:13px}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@media (max-width:900px){
  .side{display:none}
  .body{padding:16px}
}
</style>

<div class="app">
  <aside class="side">
    <div class="side-h">
      <div class="brand">맬리 어드민</div>
      <div class="brand-sub" id="ctxName">인천 남동구 치매안심센터</div>
      <span class="surface-tag" id="surfaceTag" data-s="manager">채널 · /manager</span>
    </div>
    <nav class="nav" id="nav" aria-label="주 메뉴"></nav>
    <div class="side-f">
      <button class="acct">
        <span class="avatar" id="acctIni">김</span>
        <span style="flex:1;min-width:0">
          <span class="acct-n" id="acctName">김주무 주무관</span>
          <span class="acct-r" id="acctRole">채널관리자</span>
        </span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div>
        <div class="top-t" id="pageTitle">수렴 설계</div>
        <div class="top-crumb" id="crumb">구조</div>
      </div>
      <div class="spacer"></div>
      <div class="seg" role="group" aria-label="표면 전환">
        <button id="sfManager" aria-pressed="true">채널관리자</button>
        <button id="sfAdmin" aria-pressed="false">슈퍼어드민</button>
      </div>
    </header>
    <main class="body" id="view"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="toasts" id="toasts"></div>

"use strict";
var $=function(s,r){return (r||document).querySelector(s)};

var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var fmt=function(n){return n.toLocaleString('ko-KR')};

  layers:'M10 2.5 17.5 7 10 11.5 2.5 7zM2.5 13 10 17.5 17.5 13'
};
function ico(k){return '<svg class="nav-ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+ICON[k]+'"/></svg>'}

var MENU={
manager:[
 {label:'운영',children:[
  {menuId:'today',   label:'오늘',        icon:'home',  page:'/manager/care/today',        perm:'MELI_MANAGER_CARE_TODAY',   badge:{t:'c',v:'3'}},

function toast(msg,undo){
  var t=el('div','toast','<span>'+esc(msg)+'</span>');
  if(undo){var b=el('button',null,'실행 취소');b.onclick=function(){t.remove();toast('되돌렸어요.')};t.appendChild(b)}
  $('#toasts').appendChild(t);
  setTimeout(function(){t.remove()},undo?6000:3200);
}

function renderNav(){
  var nav=$('#nav');nav.innerHTML='';
  MENU[S.surface].forEach(function(g){
    var w=el('div','nav-grp');w.appendChild(el('div','nav-grp-t',esc(g.label)));
    g.children.forEach(function(m){
      var planned=m.access==='planned', ro=m.access==='readonly';
      var b=el('button','nav-i'+(planned?' locked':''));
      b.type='button';
      if(m.menuId===S.menuId)b.setAttribute('aria-current','page');
      b.title=m.page+'  ·  '+m.perm;
      var badge='';
      if(planned)badge='<span class="pill ro">2차</span>';
      else if(ro)badge='<span class="pill ro">읽기</span>';
      else if(m.badge)badge='<span class="pill '+m.badge.t+'">'+m.badge.v+'</span>';
      b.innerHTML=ico(m.icon)+'<span class="nav-lbl">'+esc(m.label)+'</span>'+badge;
      if(planned){b.disabled=true;b.title=m.page+' · 2차 개발 범위(예정)'}
      else b.onclick=function(){S.menuId=m.menuId;S.sort={k:null,dir:null};render()};
      w.appendChild(b);
    });
    nav.appendChild(w);
  });
}

function findMenu(){
  var f=null;
  MENU[S.surface].forEach(function(g){g.children.forEach(function(m){if(m.menuId===S.menuId)f=m})});
  return f;
}

function render(){
  var a=ACCT[S.surface];
  $('#acctIni').textContent=a.ini; $('#acctName').textContent=a.name;
  $('#acctRole').textContent=a.role; $('#ctxName').textContent=a.ctx;
  var st=$('#surfaceTag');
  st.dataset.s=S.surface==='manager'?'manager':'admin';
  st.textContent=S.surface==='manager'?'채널 · /manager':'슈퍼 · /admin';
  $('#sfManager').setAttribute('aria-pressed',S.surface==='manager');
  $('#sfAdmin').setAttribute('aria-pressed',S.surface==='admin');

  var m=findMenu();
  if(!m){S.menuId='arch';m=findMenu()}
  $('#pageTitle').textContent=m.label;
  $('#crumb').textContent=m.page;
  renderNav();

  var v=$('#view');v.innerHTML='';
  var fn={arch:viewArch,people:viewPeople,channels:viewChannels,audit:viewAudit}[m.view];
  if(fn)fn(v); else viewStub(v,m);
}

function dl(d,dp){
  if(Math.abs(d)<0.05)return '<span class="delta flat">—</span>';
  var down=d<0;
  return '<span class="delta'+(down?' down':'')+'">'+(down?'▼':'▲')+Math.abs(d).toFixed(dp)+'</span>';
}

  REASON_COMMON.forEach(function(r){var o=el('option',null,esc(r.l));sel.children[1].appendChild(o)});
  REASON_CARE.forEach(function(r){var o=el('option',null,esc(r.l));sel.children[2].appendChild(o)});
  f.appendChild(sel);
  var sel2=el('select','fld');
  sel2.innerHTML='<option>전체 표면</option><option>케어센터 (/manager)</option><option>맬리 (/admin)</option>';
  f.appendChild(sel2);
  ['오늘','최근 7일','이번 달','지난 달'].forEach(function(p,i){
    var b=el('button','chip',p);b.type='button';b.setAttribute('aria-pressed',i===2);

  var tw=el('div','tw'),t=el('table');
  t.innerHTML='<thead><tr><th>시각</th><th>열람자</th><th>표면</th><th>대상</th><th>열람 항목</th><th>사유</th></tr></thead>';
  var tb=el('tbody');
  AUDIT.forEach(function(a){
    var tr=el('tr');
    tr.innerHTML=
      '<td class="mono">'+esc(a.at)+'</td>'+
      '<td>'+esc(a.who)+'</td>'+
      '<td>'+(a.surface==='care'
        ?'<span class="tag t-info"><span class="dot"></span>케어센터</span>'
        :'<span class="tag t-neu"><span class="dot"></span>맬리</span>')+'</td>'+
      '<td>'+esc(a.target)+'</td>'+
      '<td>'+esc(a.what)+'</td>'+
      '<td>'+esc(reasonLabel(a.reason))+'<span class="sub">'+esc(a.detail)+'</span></td>';
    tb.appendChild(tr);
  });
  t.appendChild(tb);tw.appendChild(t);c.appendChild(tw);
  var tf=el('div','tfoot');
  tf.innerHTML='<span>총 <b style="color:var(--g900)">5</b>건</span>';
  var sp=el('div');sp.style.flex='1';tf.appendChild(sp);
  var b=el('button','btn sm','기록 내려받기');
  b.onclick=openExport;tf.appendChild(b);

  v.appendChild(w);
}

/* ══════════════════════════════════════════════════════════
   모달
   ══════════════════════════════════════════════════════════ */
var lastFocus=null;
function modal(title,bodyEl,btns,maxw){
  var sc=$('#scrim');sc.innerHTML='';
  lastFocus=document.activeElement;
  var m=el('div','modal');
  if(maxw)m.style.maxWidth=maxw+'px';
  m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label',title.replace(/<[^>]+>/g,''));
  var h=el('div','modal-h','<div class="modal-t">'+title+'</div>');
  var x=el('button','btn qui sm','✕');x.setAttribute('aria-label','닫기');x.onclick=closeModal;
  h.appendChild(x);m.appendChild(h);
  var b=el('div','modal-b');b.appendChild(bodyEl);m.appendChild(b);
  var f=el('div','modal-f');
  (btns||[]).forEach(function(bt){
    var e=el('button',bt.cls||'btn',bt.l);
    e.onclick=function(){ if(bt.close){closeModal();return} if(bt.on)bt.on(e) };
    if(bt.id)e.id=bt.id;
    f.appendChild(e);
  });
  m.appendChild(f);sc.appendChild(m);sc.classList.add('on');
  var first=m.querySelector('select,input,textarea,button');if(first)first.focus();
}
function closeModal(){
  $('#scrim').classList.remove('on');$('#scrim').innerHTML='';
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#scrim').classList.contains('on'))closeModal()});
$('#scrim').addEventListener('mousedown',function(e){if(e.target===e.currentTarget)closeModal()});

/* ── 마스킹 해제 (공통 사유코드) ── */
function openReveal(rows){
  var b=el('div');b.style.cssText='display:flex;flex-direction:column;gap:13px';
  b.appendChild(el('p','hint','대상 <b style="color:var(--g900)">'+rows.length+'명</b> · 사유는 열람 기록에 남고 보건소 점검 때 증빙으로 제출됩니다. 열람 후 30초가 지나면 자동으로 다시 가려집니다.'));

  var wrap=el('div');
  wrap.innerHTML='<label class="lbl" for="rv-r">조회 사유 <span class="req">*</span></label>';
  var sel=el('select','fld');sel.id='rv-r';
  sel.innerHTML='<option value="">사유를 선택하세요</option>';
  var g1=el('optgroup');g1.label='공통';
  REASON_COMMON.forEach(function(r){var o=el('option',null,esc(r.l));o.value=r.v;g1.appendChild(o)});
  var g2=el('optgroup');g2.label='케어센터 전용';
  REASON_CARE.forEach(function(r){var o=el('option',null,esc(r.l));o.value=r.v;g2.appendChild(o)});
  sel.appendChild(g1);sel.appendChild(g2);
  wrap.appendChild(sel);
  b.appendChild(wrap);

  var etcWrap=el('div');etcWrap.style.display='none';
  etcWrap.innerHTML='<label class="lbl" for="rv-e">상세 사유 <span class="req">*</span></label>';
  var ta=el('textarea','fld');ta.id='rv-e';ta.placeholder='어떤 업무로 원문이 필요한지 적어주세요.';
  etcWrap.appendChild(ta);
  etcWrap.appendChild(el('div','hint','직접 입력 사유는 5자 이상 적어야 합니다.'));
  b.appendChild(etcWrap);

  var chkL=el('label','chk');
  var chk=el('input');chk.type='checkbox';chk.id='rv-ok';
  chkL.appendChild(chk);
  chkL.appendChild(el('span',null,'<b>[필수]</b> 업무 목적 외 조회하지 않겠습니다.'));
  b.appendChild(chkL);

  var err=el('div','err','사유를 고르고 동의에 체크해야 열람할 수 있습니다.');
  b.appendChild(err);

  sel.onchange=function(){etcWrap.style.display=sel.value==='ETC'?'block':'none'};

  modal('개인정보 마스킹 해제',b,[
    {l:'취소',cls:'btn',close:true},
    {l:'조회',cls:'btn pri',on:function(){
      var bad=!sel.value||!chk.checked||(sel.value==='ETC'&&ta.value.trim().length<5);
      if(bad){err.classList.add('on');return}
      rows.forEach(function(p){S.revealed[p.pin]=true});
      closeModal();render();
      toast(rows.length+'명의 원문을 열었어요. 30초 뒤 자동으로 가려집니다.',true);
      setTimeout(function(){S.revealed={};render()},30000);
    }}
  ]);
}

/* ── 다운로드 사유 ── */
function openExport(){
  var b=el('div');b.style.cssText='display:flex;flex-direction:column;gap:13px';
  var w1=el('div');
  w1.innerHTML='<label class="lbl">개인정보 범위</label>';
  var seg=el('div','seg');seg.style.width='100%';
  var masked=true;
  var b1=el('button',null,'가린 상태 (권장)'),b2=el('button',null,'원문 포함');
  b1.style.flex='1';b2.style.flex='1';
  b1.setAttribute('aria-pressed','true');b2.setAttribute('aria-pressed','false');
  seg.appendChild(b1);seg.appendChild(b2);
  w1.appendChild(seg);
  b.appendChild(w1);
  var note=el('div','hint','이름은 가운데 글자, 전화번호는 뒷 4자리만 나옵니다.');
  b.appendChild(note);

  var w2=el('div');
  w2.innerHTML='<label class="lbl" for="ex-r">다운로드 사유 <span class="req">*</span></label>';
  var sel=el('select','fld');sel.id='ex-r';
  sel.innerHTML='<option value="">사유를 선택하세요</option>';
  REASON_COMMON.concat(REASON_CARE).forEach(function(r){var o=el('option',null,esc(r.l));o.value=r.v;sel.appendChild(o)});
  w2.appendChild(sel);
  b.appendChild(w2);

  var chkL=el('label','chk');
  var chk=el('input');chk.type='checkbox';
  chkL.appendChild(chk);
  chkL.appendChild(el('span',null,'<b>[필수]</b> 업무 목적 외 다운로드하지 않겠습니다.'));
  b.appendChild(chkL);
  var err=el('div','err','사유를 고르고 동의에 체크해야 내려받을 수 있습니다.');
  b.appendChild(err);

  b1.onclick=function(){masked=true;b1.setAttribute('aria-pressed','true');b2.setAttribute('aria-pressed','false');
    note.textContent='이름은 가운데 글자, 전화번호는 뒷 4자리만 나옵니다.'};
  b2.onclick=function(){masked=false;b1.setAttribute('aria-pressed','false');b2.setAttribute('aria-pressed','true');
    note.innerHTML='<b style="color:var(--warn-fg)">원문이 파일로 나갑니다.</b> 파일 자체가 열람 기록에 남습니다.'};

  modal('명단 내려받기',b,[
    {l:'취소',cls:'btn',close:true},
    {l:'엑셀로 받기',cls:'btn pri',on:function(){
      if(!sel.value||!chk.checked){err.classList.add('on');return}
      closeModal();
      toast((masked?'가린 상태로':'원문 포함으로')+' 내려받았어요. 열람 기록에 남았습니다.');
    }}
  ]);
}
