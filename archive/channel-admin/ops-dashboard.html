function wlVal(r,key){ const e=state.edits[r.id]||{};
  switch(key){
    case 'risk': return r.risk||''; case 'name': return r.name||'';
    case 'dsl': return r.dsl==null?1e9:r.dsl;
    case 'owner': return e.owner||''; case 'status': return e.status||'미착수';
    case 'call_result': return e.call_result||''; case 'conversion': return e.conversion||'';
    case 'reengaged': return e.reengaged||''; case 'memo': return e.memo||'';
    case 'updated_at': return e.updated_at||''; default: return '';
  } }
function wlFiltered(){ const D=DATA, s=state, q=(s.q||'').trim();
  const fr=Object.keys(s.fRisk).filter(k=>s.fRisk[k]);
  const fs=Object.keys(s.fStatus).filter(k=>s.fStatus[k]);
  return D.watchlist.filter(r=>{ const e=s.edits[r.id]||{};
    if(fr.length && fr.indexOf(r.risk)<0) return false;
    if(fs.length && fs.indexOf(e.status||'미착수')<0) return false;
    if(q && !((r.name||'').indexOf(q)>=0 || (r.prov||'').indexOf(q)>=0 || (e.owner||'').indexOf(q)>=0)) return false;
    return true; }); }
function wlSorted(rows){ const s=state; if(!s.sortKey) return rows;
  return rows.slice().sort((a,b)=>{ let x=wlVal(a,s.sortKey), y=wlVal(b,s.sortKey), c;
    if(typeof x==='number'&&typeof y==='number') c=x-y;
    else{ x=String(x); y=String(y); if(x===''&&y!=='') return 1; if(y===''&&x!=='') return -1; c=x.localeCompare(y,'ko'); }
    return c*(s.sortAsc?1:-1); }); }
function currentPageRows(){ const s=state, sorted=wlSorted(wlFiltered());
  const total=sorted.length, pages=s.size===0?1:Math.max(1,Math.ceil(total/s.size));
  const page=Math.min(Math.max(1,s.page),pages);
  return s.size===0? sorted : sorted.slice((page-1)*s.size,(page-1)*s.size+s.size); }
function patch(ids, field, value){ const e=Object.assign({},state.edits), d=Object.assign({},state.dirty);
  ids.forEach(id=>{ e[id]=Object.assign({},e[id]); e[id][field]=value; d[id]=true; });

function parseCSV(text){ text=text.replace(/^﻿/,''); const rows=[]; let f='',row=[],q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(f);f='';}
      else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
      else if(c==='\r'){} else f+=c; } }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.length>1||r[0]!==''); }

:10px;border-top:1px solid #EFF1F5"><button type="button" data-a="onPlanAct" data-pid="${p.id}" data-act="secadd" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:8px;padding:7px 14px;font-size:14px;font-weight:700">＋ 항목 추가</button><span style="flex:1"></span><button type="button" data-a="onPlanAct" data-pid="${p.id}" data-act="save" style="cursor:pointer;border:2px solid #1F3BD0;background:#1F3BD0;color:#fff;border-radius:8px;padding:7px 18px;font-size:14px;font-weight:800">저장</button><button type="button" data-a="onPlanAct" data-pid="${p.id}" data-act="cancel" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:8px;padding:7px 14px;font-size:14px;font-weight:700">취소</button></div></div>`:''}</div>`).join('')}</div>

function render(){
  const V=computeVals();
  let body;
  if(V.tab1) body=hTab1(V); else if(V.tab2) body=hTab2(V); else if(V.tab3) body=hTab3(V); else if(V.tab4) body=hTab4(V); else body=hTab5(V);
  const toast=V.hasToast?`<div style="position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#0F1B3D;color:#fff;padding:13px 24px;border-radius:11px;font-size:15px;font-weight:700;z-index:200;box-shadow:0 8px 28px rgba(15,27,61,.3)">${esc(V.toast)}</div>`:'';
  document.getElementById('app').innerHTML = hHeader(V)+`<main style="max-width:1480px;margin:0 auto;padding:32px 32px 90px">${body}</main>`+toast;
}

/* ---------- state loop + handlers ---------- */
function setState(patchObj){ if(typeof patchObj==='function') patchObj=patchObj(state); Object.assign(state, patchObj); render(); }
function syncSave(){
  const dc=Object.keys(state.dirty).filter(k=>state.dirty[k]).length;
  const bar=document.getElementById('saveBar'), btn=document.getElementById('saveBtn'), stat=document.getElementById('saveStat');
  if(!bar||!btn||!stat) return;
  bar.style.background=dc>0?C.amberSoft:C.panel; bar.style.borderColor=dc>0?C.amber:C.panel2;
  btn.style.background=dc>0?C.blue:'#fff'; btn.style.borderColor=dc>0?C.blue:C.line; btn.style.color=dc>0?'#fff':C.sub;
  stat.style.color=dc>0?C.amberInk:C.mut;
  stat.textContent=dc>0?('저장 안 된 변경 '+dc+'건'):(state.lastSaved?('저장됨 · 마지막 '+state.lastSaved):'변경 없음');
}
function selIds(){ return Object.keys(state.sel).filter(k=>state.sel[k]); }
function dirtyIds(){ return Object.keys(state.dirty).filter(k=>state.dirty[k]); }

const ACT = {
  onTab: e => setState({tab:e.currentTarget.dataset.tab}),
  onTerms: () => setState({termsOpen:!state.termsOpen}),
  onGSort: e => { const k=e.currentTarget.dataset.k; if(!k) return;
    setState(st=> st.gSort===k ? {gAsc:!st.gAsc} : {gSort:k, gAsc:(k==='name')}); },
  onChip: e => { const g=e.currentTarget.dataset.grp, v=e.currentTarget.dataset.val, key=g==='risk'?'fRisk':'fStatus';
    const next=Object.assign({},state[key]); next[v]=!next[v]; setState({[key]:next, page:1}); },
  onClearFilter: () => setState({fRisk:{},fStatus:{},page:1}),
  onSearch: e => setState({q:e.target.value, page:1}),
  onToggleTM: () => setState({showTM:!state.showTM}),
  onPageSize: e => setState({size:+e.currentTarget.dataset.size, page:1}),
  onPage: e => setState(st=>({ page: e.currentTarget.dataset.pg==='prev'?Math.max(1,st.page-1):st.page+1 })),
  onSort: e => { const k=e.currentTarget.dataset.k; if(!k) return;
    setState(st=> st.sortKey===k ? {sortAsc:!st.sortAsc} : {sortKey:k, sortAsc:true}); },
  onAll: e => { const on=e.target.checked, sel=Object.assign({},state.sel);
    currentPageRows().forEach(r=>{ if(on) sel[r.id]=true; else delete sel[r.id]; }); setState({sel}); },
  onRowChk: e => { const id=e.target.dataset.id, sel=Object.assign({},state.sel);
    if(e.target.checked) sel[id]=true; else delete sel[id]; setState({sel}); },
  onEdit: e => { const t=e.target; patch([t.dataset.id], t.dataset.f, t.value);
    const row=document.querySelector('tr[data-id="'+t.dataset.id+'"] .dmark'); if(row) row.textContent='●'; syncSave(); },
  onSelClear: () => setState({sel:{}}),
  onBulkStatusSel: e => { state.bulkStatus=e.target.value; },
  onBulkOwnerInput: e => { state.bulkOwner=e.target.value; },
  onBulkMemoInput: e => { state.bulkMemo=e.target.value; },
  onBulkStatus: () => { const v=state.bulkStatus, ids=selIds(); if(!v||!ids.length) return;
    patch(ids,'status',v); toast('진행상태 «'+v+'» '+ids.length+'명 적용 · 저장 필요'); },
  onBulkOwner: () => { const ids=selIds(); if(!ids.length) return; const v=(state.bulkOwner||'').trim();
    patch(ids,'owner',v); toast('담당자 «'+(v||'비움')+'» '+ids.length+'명 적용 · 저장 필요'); },
  onBulkMemo: () => { const ids=selIds(); if(!ids.length) return;
    patch(ids,'memo',state.bulkMemo||''); toast('메모 '+ids.length+'명 적용 · 저장 필요'); },
  onSave: () => { const ids=dirtyIds(); if(!ids.length){ toast('저장할 변경사항이 없습니다'); return; }
    const now=stamp(), e=Object.assign({},state.edits);
    ids.forEach(id=>{ e[id]=Object.assign({},e[id]); e[id].updated_at=now; });
    saveEdits(e); try{ localStorage.setItem(WL_SAVED, now); }catch(x){}
    state.edits=e; state.dirty={}; state.lastSaved=now; render(); toast(ids.length+'건 저장됨 · '+now); },
  onResetEdits: () => { if(!window.confirm('편집한 담당자·진행상태·메모·기록을 모두 지웁니다. 계속할까요?')) return;
    saveEdits({}); try{ localStorage.removeItem(WL_SAVED); }catch(x){}
    state.edits={}; state.dirty={}; state.sel={}; state.lastSaved=''; render(); toast('편집 내용을 초기화했습니다'); },
  onImportClick: () => { const f=document.getElementById('wlFile'); if(f) f.click(); },
  onExport: () => { const HDR=['id','이름','연령','성별','기관','미접속일','위험도','담당자','진행상태','통화결과','핵심전환','1주후재접속','메모','최종수정'];
    const sIds=selIds(), filtered=wlFiltered(), src=sIds.length?filtered.filter(r=>state.sel[r.id]):filtered;
    const lines=[HDR.map(csvCell).join(',')].concat(src.map(r=>{ const e=state.edits[r.id]||{};
      return [r.id,r.name,r.age,r.sex,r.prov,r.dsl,r.risk,e.owner||'',e.status||'미착수',e.call_result||'',e.conversion||'',e.reengaged||'',e.memo||'',e.updated_at||''].map(csvCell).join(','); }));
    download('맬리브레인_대상자관리.csv', lines.join('\r\n'), 'text/csv'); toast(src.length+'건 내보냈습니다'); },
  onFile: e => { const file=e.target.files&&e.target.files[0]; if(!file) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const rows=parseCSV(String(rd.result)), head=rows.shift()||[], ci=n=>head.indexOf(n);
      const iId=ci('id'), map={ owner:ci('담당자'), status:ci('진행상태'), call_result:ci('통화결과'), conversion:ci('핵심전환'), reengaged:ci('1주후재접속'), memo:ci('메모'), updated_at:ci('최종수정') };
      if(iId<0){ window.alert('id 열을 찾을 수 없습니다. 내보낸 CSV 형식인지 확인하세요.'); return; }
      const valid={}; DATA.watchlist.forEach(r=>valid[r.id]=1); const e=Object.assign({},state.edits); let ok=0,miss=0;
      rows.forEach(r=>{ const id=(r[iId]||'').trim(); if(!id) return; if(!valid[id]){ miss++; return; }
        const cur=Object.assign({},e[id]); Object.keys(map).forEach(f=>{ const i=map[f]; if(i>=0&&r[i]!=null&&r[i]!=='') cur[f]=r[i].trim(); }); e[id]=cur; ok++; });
      saveEdits(e); state.edits=e; state.dirty={}; render();
      window.alert('불러오기 완료 · '+ok+'건 반영'+(miss?(' / '+miss+'건 미매칭(명단에 없는 id)'):'')); }
      catch(err){ window.alert('CSV를 읽지 못했습니다: '+err.message); }
      const f2=document.getElementById('wlFile'); if(f2) f2.value=''; };
    rd.readAsText(file,'utf-8'); },
  onPlanAdd: () => { const id='p'+Date.now().toString(36);
    const p={ id, status:'검토중', title:'새 방안', summary:'', sections:PLAN_TMPL.map(l=>({l,b:''})), updated_at:'' };
    const plans=state.plans.concat([p]); state.planSaved=savePlans(plans); setState({plans, editingPlan:id}); },
  onPlanReset: () => { if(!window.confirm('편집한 내용을 버리고 기본 3안으로 되돌립니다. 계속할까요?')) return;
    const plans=seedPlans(); state.planSaved=savePlans(plans); setState({plans, editingPlan:null}); toast('기본 3안으로 되돌렸습니다'); },
  onPlanExport: () => { const md=state.plans.map(p=>'# '+p.title+'  ('+p.status+')\n\n'+p.summary+'\n\n'+(p.sections||[]).map(x=>'## '+x.l+'\n'+x.b).join('\n\n')).join('\n\n---\n\n');
    download('맬리_이벤트_실행방안.md', md, 'text/markdown'); },
  onPlanField: e => { const t=e.target, pid=t.dataset.pid, f=t.dataset.ef;
    state.plans=state.plans.map(p=> p.id===pid ? Object.assign({},p,{[f]:t.value}) : p); },
  onPlanSection: e => { const t=e.target, pid=t.dataset.pid, si=+t.dataset.si, f=t.dataset.sf;
    state.plans=state.plans.map(p=>{ if(p.id!==pid) return p;
      const sections=p.sections.map((x,i)=> i===si ? Object.assign({},x,{[f]:t.value}) : x); return Object.assign({},p,{sections}); }); },
  onPlanAct: e => { const b=e.currentTarget, pid=b.dataset.pid, act=b.dataset.act;
    let plans=state.plans.slice(); const idx=plans.findIndex(p=>p.id===pid); if(idx<0) return; const p=plans[idx];
    if(act==='edit'){ setState({editingPlan:pid}); return; }
    if(act==='cancel'){ let restored=plans; try{ const v=JSON.parse(localStorage.getItem(PLAN_KEY)); if(Array.isArray(v)&&v.length) restored=v; }catch(x){}
      setState({plans:restored, editingPlan:null}); return; }
    if(act==='save'){ plans[idx]=Object.assign({},p,{updated_at:stamp()}); state.planSaved=savePlans(plans); setState({plans, editingPlan:null}); toast('방안을 저장했습니다'); return; }
    if(act==='adopt'){ plans[idx]=Object.assign({},p,{status:'채택',updated_at:stamp()}); state.planSaved=savePlans(plans); setState({plans}); toast('«'+p.title+'» 채택'); return; }
    if(act==='dup'){ const c=JSON.parse(JSON.stringify(p)); c.id='p'+Date.now().toString(36); c.title=p.title+' (복제)'; c.status='검토중'; c.updated_at=stamp();
      plans.splice(idx+1,0,c); state.planSaved=savePlans(plans); setState({plans}); toast('복제했습니다'); return; }
    if(act==='del'){ if(!window.confirm('«'+p.title+'» 방안을 삭제할까요?')) return; plans.splice(idx,1); state.planSaved=savePlans(plans);
      setState({plans, editingPlan: state.editingPlan===pid?null:state.editingPlan}); toast('삭제했습니다'); return; }
    if(act==='secadd'){ plans[idx]=Object.assign({},p,{sections:(p.sections||[]).concat([{l:'',b:''}])}); setState({plans}); return; }
    if(act==='secdel'){ const si=+b.dataset.si; plans[idx]=Object.assign({},p,{sections:p.sections.filter((_,i)=>i!==si)}); setState({plans}); return; }
  }
};

document.addEventListener('click', ev=>{ const el=ev.target.closest('[data-a]'); if(!el) return;
  const fn=ACT[el.dataset.a]; if(fn) fn({currentTarget:el, target:ev.target}); });
document.addEventListener('change', ev=>{ const el=ev.target.closest('[data-c]'); if(!el) return;
  const fn=ACT[el.dataset.c]; if(fn) fn({currentTarget:el, target:ev.target}); });

render();
</script>
