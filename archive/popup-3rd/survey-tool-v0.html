<!DOCTYPE html>
<html lang="ko">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>맬리브레인 팝업 · 설문 입력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101A2E;--ink2:#3C4761;--mut:#6E7890;--faint:#98A0B4;
  --paper:#EEF0F4;--card:#FFF;--line:#D9DDE6;--line2:#EAEDF2;--hov:#F5F7FA;
  --a:#15654A;--aBg:#E2EFE9;--b:#A85A0C;--bBg:#F8EDDD;--c:#9C2B2B;--cBg:#F7E5E5;
  --blue:#2244C4;--blueBg:#E2E8FB;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#EDEFF4;--ink2:#C3C9D6;--mut:#98A0B4;--faint:#6E7890;
  --paper:#0E1219;--card:#181E29;--line:#2B3342;--line2:#222936;--hov:#1F2634;
  --a:#5FC79E;--aBg:#16302A;--b:#E0A050;--bBg:#332616;--c:#E08080;--cBg:#331C1C;
  --blue:#7D9BF5;--blueBg:#1A2340;}}
:root[data-theme="dark"]{
  --ink:#EDEFF4;--ink2:#C3C9D6;--mut:#98A0B4;--faint:#6E7890;
  --paper:#0E1219;--card:#181E29;--line:#2B3342;--line2:#222936;--hov:#1F2634;
  --a:#5FC79E;--aBg:#16302A;--b:#E0A050;--bBg:#332616;--c:#E08080;--cBg:#331C1C;
  --blue:#7D9BF5;--blueBg:#1A2340;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Gothic A1',-apple-system,BlinkMacSystemFont,'Malgun Gothic',system-ui,sans-serif;
  font-size:15px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}

#top{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#top h1{font-size:15px;font-weight:800;margin:0;letter-spacing:-.02em;white-space:nowrap}
#top h1 small{font-weight:500;color:var(--faint);font-size:12px;margin-left:8px}
.prog{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.pchip{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:7px;background:var(--paper);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pchip.A{background:var(--aBg);color:var(--a)}
.pchip.B{background:var(--bBg);color:var(--b)}
.pchip.C{background:var(--cBg);color:var(--c)}
.tbtn{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 11px;
  font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--hov)}
.tbtn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tbtn.adm{background:var(--blueBg);color:var(--blue);border-color:transparent}
#wholab{display:flex;align-items:center;gap:7px;background:var(--blueBg);padding:3px 8px 3px 11px;border-radius:8px;white-space:nowrap}
#wholab span{font-size:11.5px;font-weight:800;color:var(--blue)}
#who{font-size:13px;font-weight:700;color:var(--ink);background:var(--card);
  padding:4px 7px;border-radius:6px;cursor:pointer;border:1px solid var(--line)}
#who.unset{background:var(--cBg);color:var(--c);border-color:var(--c)}
#dbstate{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}

#main{flex:1 1 auto;display:flex;min-height:0}
#side{flex:0 0 330px;border-right:1px solid var(--line);display:flex;flex-direction:column;
  background:var(--card);min-height:0}
#filters{flex:0 0 auto;padding:11px 13px;border-bottom:1px solid var(--line2)}
#qwrap{position:relative;margin-bottom:8px}
#q{width:100%;padding:8px 32px 8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
#qx{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:23px;height:23px;border:none;
  background:var(--line);color:var(--ink2);border-radius:50%;cursor:pointer;font-size:11px;line-height:1;
  display:none;padding:0}
#qx:hover{background:var(--c);color:#fff}
#qwrap.has #qx{display:block}
.frow{display:flex;gap:5px;flex-wrap:wrap}
.fchip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid var(--line);
  background:transparent;cursor:pointer;color:var(--mut)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
#list .emptylist{font-size:13px;color:var(--ink2);line-height:1.75;padding:18px 14px 14px}
#list .emptylist b{color:var(--ink)}
#listmeta{font-size:11.5px;color:var(--faint);padding:7px 14px 3px;font-variant-numeric:tabular-nums}
#list{flex:1 1 auto;overflow-y:auto;min-height:0}
.row{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid var(--line2);
  cursor:pointer;width:100%;background:transparent;border-left:4px solid transparent;text-align:left}
.row:hover{background:var(--hov)}
.row[aria-current="true"]{background:var(--blueBg)}
.row.A{border-left-color:var(--a)} .row.B{border-left-color:var(--b)} .row.C{border-left-color:var(--c)}
.rnm{font-weight:700;font-size:14.5px;flex:0 0 auto;min-width:60px}
.rmeta{font-size:11.5px;color:var(--mut);flex:1 1 auto;font-variant-numeric:tabular-nums;min-width:0}
.rst{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;flex:0 0 auto;white-space:nowrap}
.st-done{background:var(--aBg);color:var(--a)}
.st-prog{background:var(--blueBg);color:var(--blue)}
.st-no{background:var(--cBg);color:var(--c)}

#pane{flex:1 1 auto;overflow-y:auto;min-height:0;padding:0 0 70px}
.inner{max-width:720px;margin:0 auto;padding:22px 26px}
#empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);
  font-size:15px;text-align:center;padding:30px;line-height:1.8}

.shead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.sname{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.tbadge{font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:8px;margin-top:5px}
.tbadge.A{background:var(--aBg);color:var(--a)}
.tbadge.B{background:var(--bBg);color:var(--b)}
.tbadge.C{background:var(--cBg);color:var(--c)}
.sfacts{font-size:13px;color:var(--mut);margin:0 0 4px;font-variant-numeric:tabular-nums}
.vcard{background:var(--card);border:2px solid var(--blue);border-radius:13px;padding:20px 22px;margin:18px 0 0}
.vh{font-size:16px;font-weight:800;margin-bottom:14px}
.vask{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--blue);margin-bottom:18px;line-height:1.35}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.vcell{background:var(--paper);border-radius:9px;padding:10px 13px}
.vcell.big{grid-column:span 2;background:var(--blueBg)}
.vl{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:2px}
.vv{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.vcell.big .vv{font-size:27px;letter-spacing:.09em}
.vbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.vbtns .tbtn{padding:9px 16px;font-size:13.5px}
.idok{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:var(--aBg);color:var(--a);
  border-radius:9px;padding:8px 14px;margin:14px 0 0;font-size:12.5px;font-weight:800}
.idokv{color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}
.idre{margin-left:auto;background:none;border:none;color:var(--mut);font-size:12px;font-weight:700;
  text-decoration:underline;cursor:pointer;padding:0}
.idbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--blueBg);
  border-radius:10px;padding:11px 15px;margin:14px 0 0;font-size:14px}
.idlab{font-size:11.5px;font-weight:800;color:var(--blue)}
.idval{font-variant-numeric:tabular-nums;font-size:17px;font-weight:800;letter-spacing:.02em}
.idval b{font-size:11.5px;font-weight:700;color:var(--mut);margin-right:5px;letter-spacing:0}
.idnote{font-size:12.5px;color:var(--ink2);flex:1 1 100%}
.sguide{font-size:13.5px;color:var(--ink2);background:var(--paper);border-radius:9px;
  padding:11px 14px;margin:14px 0 22px;border-left:3px solid var(--line);white-space:pre-wrap}
.lock{background:var(--bBg);color:var(--b);font-size:13px;font-weight:700;padding:9px 13px;
  border-radius:9px;margin-bottom:16px}

.qb{margin-bottom:21px}
.ql{font-weight:700;font-size:15.5px;margin-bottom:8px;display:block}
.ql .req{color:var(--c);margin-left:4px}
.ql .hint{display:block;font-weight:500;font-size:12.5px;color:var(--mut);margin-top:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;
  font-size:14px;cursor:pointer;color:var(--ink2)}
.opt:hover{background:var(--hov)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:700}
.opt.many[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  background:var(--card);resize:vertical}
textarea{min-height:62px}
select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--card)}
.sec{font-size:12px;font-weight:800;color:var(--faint);margin:30px 0 13px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}

#save{position:fixed;right:22px;bottom:20px;background:var(--ink);color:var(--card);
  font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:120}
#save.on{opacity:1}

/* admin */
#admin{position:fixed;inset:0;background:var(--paper);z-index:90;display:none;flex-direction:column}
#admin.on{display:flex}
#abar{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);padding:11px 18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#abar h2{font-size:15px;font-weight:800;margin:0}
#abody{flex:1 1 auto;overflow-y:auto;min-height:0}
#abody .inner{max-width:840px}
.atabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.atab{font-size:13px;font-weight:700;padding:6px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;color:var(--mut)}
.atab[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden}
.qcard.isSec{background:var(--paper)}
.qhead{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer}
.qtype{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;background:var(--paper);
  color:var(--mut);flex:0 0 auto}
.qcard.isSec .qtype{background:var(--ink);color:var(--card)}
.qtext{flex:1 1 auto;font-weight:700;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qkey{font-size:11px;color:var(--faint);flex:0 0 auto}
.qacts{display:flex;gap:3px;flex:0 0 auto}
.mini{width:26px;height:26px;border:1px solid var(--line);background:var(--card);border-radius:6px;
  cursor:pointer;font-size:13px;font-weight:700;color:var(--mut);line-height:1;padding:0}
.mini:hover{background:var(--hov);color:var(--ink)}
.mini.del:hover{background:var(--cBg);color:var(--c);border-color:var(--c)}
.qedit{padding:4px 14px 16px;border-top:1px solid var(--line2);display:none}
.qcard.open .qedit{display:block}
.fld{margin-top:13px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px}
.frow2{display:flex;gap:10px;flex-wrap:wrap}
.frow2 .fld{flex:1 1 180px}
.note{font-size:13px;color:var(--ink2);background:var(--blueBg);border-radius:9px;padding:11px 14px;margin-bottom:20px}

#cards{position:fixed;inset:0;background:#fff;color:#000;z-index:100;overflow:auto;display:none;padding:26px}
#cards.on{display:block}
#cards .bar{display:flex;gap:10px;margin-bottom:22px}
.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gcard{border:2.5px solid #111;border-radius:12px;padding:30px 16px;text-align:center;
  font-size:26px;font-weight:800;line-height:1.3;min-height:150px;display:flex;
  align-items:center;justify-content:center;break-inside:avoid}
@media print{
  body{overflow:visible} #top,#main,#save,#admin{display:none!important}
  #cards{position:static;display:block;padding:0} #cards .bar{display:none}
  .cardgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .gcard{min-height:230px;font-size:30px}
}
@media (max-width:860px){
  #main{flex-direction:column} #side{flex:0 0 auto;max-height:36vh;border-right:none;border-bottom:1px solid var(--line)}
  .inner{padding:18px 16px} .cardgrid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div id="top">
  <h1>맬리브레인 팝업 · 설문 입력<small>10/30 남동구 보건소</small></h1>
  <label id="wholab"><span>입력자</span><select id="who"></select></label>
  <span id="dbstate"></span>
  <div class="prog" id="prog"></div>
  <button class="tbtn adm" id="admbtn" type="button" style="display:none">설문지 편집</button>
  <button class="tbtn" id="cardsbtn" type="button">게임 카드 인쇄</button>
  <button class="tbtn" id="csvbtn" type="button">응답 내보내기</button>
</div>

<div id="main">
  <div id="side">
    <div id="filters">
      <div id="qwrap"><input id="q" type="text" placeholder="이름 · 전화 뒷 4자리 · 생년" autocomplete="off"><button id="qx" type="button" title="지우기">✕</button></div>
      <div class="frow" id="ftrack"></div>
      <div class="frow" id="fstat" style="margin-top:5px"></div>
      <div class="frow" id="fco" style="margin-top:5px"></div>
      <button class="tbtn" id="addbtn" type="button" style="margin-top:9px;width:100%">명단에 없는 분 추가</button>
    </div>
    <div id="listmeta"></div>
    <div id="list"></div>
  </div>
  <div id="pane"><div id="empty">왼쪽에서 어르신을 찾아 선택하세요.<br>트랙과 질문지가 자동으로 맞춰집니다.</div></div>
</div>

<div id="save">저장됨</div>

<div id="admin">
  <div id="abar">
    <h2>설문지 편집</h2>
    <span id="ameta" style="font-size:12px;color:var(--faint)"></span>
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      <button class="tbtn" id="areset" type="button">기본값으로 되돌리기</button>
      <button class="tbtn" id="acancel" type="button">취소</button>
      <button class="tbtn pri" id="asave" type="button">저장하고 현장에 반영</button>
    </div>
  </div>
  <div id="abody"><div class="inner" id="ainner"></div></div>
</div>

<div id="cards">
  <div class="bar">
    <button class="tbtn" onclick="window.print()">인쇄</button>
    <button class="tbtn" onclick="document.getElementById('cards').classList.remove('on')">닫기</button>
    <span style="font-size:13px;color:#555;align-self:center">A4 가로로 뽑아 코팅하면 트랙 B에서 짚어 보여드리기 좋습니다.</span>
  </div>
  <div class="cardgrid" id="cardgrid"></div>
</div>

function nrm(s){return (s||'').replace(/\s+/g,'')}
function isSub(a,b){let i=0;for(const ch of b){if(ch===a[i])i++;if(i>=a.length)return true}return i>=a.length}
function nameHit(nm,real,q,p){
  nm=nrm(nm);real=nrm(real);q=nrm(q);
  if(!q)return true;
  if(/^[0-9]+$/.test(q)){
    if(p&&p.l4&&p.l4.indexOf(q)===0)return true;
    if(p&&p.by&&(p.by===q||p.by.slice(2)===q))return true;
    return false}
  if(real&&real.indexOf(q)>=0)return true;
  if(nm.indexOf(q)>=0)return true;
  if(nm.length===q.length){let ok=true;
    for(let i=0;i<nm.length;i++)if(nm[i]!=='*'&&nm[i]!==q[i]){ok=false;break}
    if(ok)return true}
  const st=nm.replace(/\*/g,'');
  if(st&&isSub(st,q))return true;
  if(nm[0]&&nm[0]===q[0])return true;
  return false;
}

      tr:st.tr,why:st.why,risk:'명단 외',staff:staff,at:now()};
    rebuildExtra();queueSave(id);paintProg();openRec(id)};
  w.appendChild(go);
  pane.appendChild(w);pane.scrollTop=0;
}

/* ---------- admin ---------- */
function openAdmin(){DRAFT=clone(SCHEMA);aTab='common';$('#admin').classList.add('on');paintAdmin()}
function closeAdmin(){$('#admin').classList.remove('on');DRAFT=null}
function paintAdmin(){
  $('#ameta').textContent=SCHEMA.v?('최종 수정 '+SCHEMA.v+(SCHEMA.by?' · '+SCHEMA.by:'')):'아직 저장된 적 없음 (기본 설문지)';
  const w=$('#ainner');w.innerHTML='';
  const n=el('div','note');
  n.textContent='여기서 고치고 「저장하고 현장에 반영」을 누르면 현장 노트북 화면이 바로 바뀝니다. 이미 입력된 응답은 지워지지 않습니다. 다만 질문을 지우면 그 질문의 답은 내보내기에서 빠집니다.';
  w.appendChild(n);
  const tabs=el('div','atabs');
  SECS.concat([['_staff','담당자 명단']]).forEach(([k,l])=>{const b=el('button','atab',l);b.type='button';
    b.setAttribute('aria-pressed',aTab===k?'true':'false');
    b.onclick=()=>{aTab=k;paintAdmin()};tabs.appendChild(b)});
  w.appendChild(tabs);
  if(aTab==='_staff'){
    const f=el('div','fld');
    f.appendChild(el('label','','임직원 명단 (한 줄에 한 명씩)'));
    const ta=document.createElement('textarea');ta.style.minHeight='300px';
    ta.value=(DRAFT.staffList||STAFF0).join('\n');
    ta.oninput=()=>{DRAFT.staffList=ta.value.split('\n').map(s=>s.trim()).filter(Boolean)};
    f.appendChild(ta);w.appendChild(f);
    const n2=el('div','note');n2.style.marginTop='16px';
    n2.textContent='여기 명단이 화면 위쪽 「입력자」 선택지와 「설문을 도와준 담당자」 보기에 함께 쓰입니다. 이름을 빼도 이미 저장된 응답의 담당자 기록은 그대로 남습니다.';
    w.appendChild(n2);return}
  if(aTab==='A'||aTab==='B'||aTab==='C'){
    const f=el('div','fld');f.appendChild(el('label','','응대자에게 보여줄 안내문 (화면 맨 위 회색 박스)'));
    const ta=document.createElement('textarea');ta.value=(DRAFT.guide||{})[aTab]||'';
    ta.oninput=()=>{DRAFT.guide=DRAFT.guide||{};DRAFT.guide[aTab]=ta.value};
    f.appendChild(ta);f.style.marginBottom='22px';w.appendChild(f)}
  const list=DRAFT.s[aTab]||(DRAFT.s[aTab]=[]);
  list.forEach((qq,i)=>w.appendChild(qcard(qq,i,list)));
  const add=el('div');add.style.cssText='display:flex;gap:8px;margin-top:14px;flex-wrap:wrap';
  const b1=el('button','tbtn pri','질문 추가');b1.type='button';
  b1.onclick=()=>{list.push({k:'x'+(++kseq),t:'one',q:'새 질문',o:['보기 1','보기 2'],_open:1});paintAdmin()};
  const b2=el('button','tbtn','구분선 추가');b2.type='button';
  b2.onclick=()=>{list.push({k:'s'+(++kseq),t:'sec',q:'새 구분선'});paintAdmin()};
  add.appendChild(b1);add.appendChild(b2);w.appendChild(add);
}
function qcard(qq,i,list){
  const c=el('div','qcard'+(qq.t==='sec'?' isSec':'')+(qq._open?' open':''));
  const h=el('div','qhead');
  h.appendChild(el('span','qtype',(TYPES.find(t=>t[0]===qq.t)||['','?'])[1]));
  h.appendChild(el('span','qtext',qq.q||'(제목 없음)'));
  h.appendChild(el('span','qkey',qq.k));
  const acts=el('div','qacts');
  const mk=(txt,cls,fn,dis)=>{const b=el('button','mini'+(cls?' '+cls:''),txt);b.type='button';
    b.disabled=!!dis;b.style.opacity=dis?.3:1;b.onclick=e=>{e.stopPropagation();fn()};return b};
  acts.appendChild(mk('↑','',()=>{const t=list[i-1];list[i-1]=list[i];list[i]=t;paintAdmin()},i===0));
  acts.appendChild(mk('↓','',()=>{const t=list[i+1];list[i+1]=list[i];list[i]=t;paintAdmin()},i===list.length-1));
  acts.appendChild(mk('⧉','',()=>{const n=clone(qq);n.k='x'+(++kseq);delete n._open;list.splice(i+1,0,n);paintAdmin()}));
  acts.appendChild(mk('✕','del',()=>{if(confirm('이 항목을 지울까요?\n\n'+(qq.q||'')))
    {list.splice(i,1);paintAdmin()}}));
  h.appendChild(acts);
  h.onclick=()=>{qq._open=!qq._open;paintAdmin()};
  c.appendChild(h);
  const ed=el('div','qedit');
  ed.appendChild(fld('질문 문구',qq.q||'',v=>{qq.q=v;h.querySelector('.qtext').textContent=v||'(제목 없음)'},'text'));
  if(qq.t!=='sec'){
    const r1=el('div','frow2');
    r1.appendChild(sel('유형',TYPES,qq.t,v=>{qq.t=v;if((v==='one'||v==='many')&&!(qq.o&&qq.o.length))qq.o=['보기 1'];paintAdmin()}));
    r1.appendChild(sel('필수 여부',[['0','선택'],['1','필수(빨간 별)']],qq.req?'1':'0',v=>{qq.req=v==='1'?1:0}));
    r1.appendChild(sel('표시 조건',[['','항상 보임'],['lapsed','최근 15일 이상 조용한 분에게만']],qq.cond||'',v=>{qq.cond=v||undefined}));
    ed.appendChild(r1);
    ed.appendChild(fld('응대자용 도움말 (질문 아래 작은 회색 글씨)',qq.hint||'',v=>{qq.hint=v},'area'));
    if(qq.t==='one'||qq.t==='many')
      ed.appendChild(fld('보기 (한 줄에 하나씩)',(qq.o||[]).join('\n'),v=>{qq.o=v.split('\n').map(s=>s.trim()).filter(Boolean)},'area',160));
    if(qq.t==='staff'){const nf=el('div','fld');
      nf.appendChild(el('label','','보기'));
      const p2=el('div','','「담당자 명단」 탭의 임직원 이름이 그대로 보기로 뜹니다. 여러 명 고를 수 있습니다.');
      p2.style.cssText='font-size:13px;color:var(--mut)';nf.appendChild(p2);ed.appendChild(nf)}
    const kf=el('div','fld');kf.appendChild(el('label','','저장 이름 (내보내기 CSV의 열 이름)'));
    const ki=document.createElement('input');ki.type='text';ki.value=qq.k;
    ki.oninput=()=>{qq.k=ki.value.replace(/[^A-Za-z0-9_]/g,'')};
    kf.appendChild(ki);
    kf.appendChild(el('label','','이미 응답을 받은 뒤에 바꾸면 그 전 답과 연결이 끊깁니다. 행사 전에만 바꾸세요.'));
    kf.querySelector('label:last-child').style.cssText='margin-top:5px;font-weight:500;color:var(--faint)';
    ed.appendChild(kf)}
  c.appendChild(ed);return c;
}
function fld(label,val,fn,type,h){
  const f=el('div','fld');f.appendChild(el('label','',label));
  const i=document.createElement(type==='area'?'textarea':'input');
  if(type!=='area')i.type='text';
  if(h)i.style.minHeight=h+'px';
  i.value=val;i.oninput=()=>fn(i.value);f.appendChild(i);return f;
}
function sel(label,opts,val,fn){
  const f=el('div','fld');f.appendChild(el('label','',label));
  const s=document.createElement('select');
  opts.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;s.appendChild(o)});
  s.value=val;s.onchange=()=>fn(s.value);f.appendChild(s);return f;
}
async function saveSchema(){
  const keys=[];let dup='';
  SECS.forEach(([k])=>(DRAFT.s[k]||[]).forEach(x=>{if(x.t==='sec')return;
    if(!x.k){dup='저장 이름이 빈 질문이 있습니다.'}
    else if(keys.indexOf(x.k)>=0)dup='저장 이름이 겹칩니다: '+x.k;else keys.push(x.k)}));
  if(dup){alert(dup);return}
  const out=clone(DRAFT);
  SECS.forEach(([k])=>(out.s[k]||[]).forEach(x=>delete x._open));
  out.v=now();out.by=staff||'이름 미지정';
  if(!DB){alert('공유 저장이 연결되지 않아 이 기기에만 반영됩니다.');SCHEMA=out;
    try{localStorage.setItem('mb_schema',JSON.stringify(out))}catch(e){}
    paintWho();closeAdmin();if(cur)openRec(cur);return}
  try{await DB.doc('config/schema').set(out)}
  catch(e){alert('저장하지 못했습니다 ('+((e&&e.code)||'오류')+'). 편집 권한이 없는 계정일 수 있습니다.');return}
  SCHEMA=out;try{localStorage.setItem('mb_schema',JSON.stringify(out))}catch(e){}
  paintWho();closeAdmin();if(cur)openRec(cur);flash('설문지가 현장에 반영됐습니다');
}

/* ---------- csv / cards ---------- */
function csvKeys(){
  const base=['id','nm','l4','by','co','tr','risk','manual','why','age','sex','vf','vfby','vfat','real','staff','at'],seen={};
  base.forEach(k=>seen[k]=1);const out=base.slice();
  allQ().forEach(x=>{if(x.t==='sec'||seen[x.k])return;seen[x.k]=1;out.push(x.k)});
  return out;
}
function csv(){
  const keys=csvKeys();
  const esc=v=>{if(v==null)v='';if(Array.isArray(v))v=v.join(' | ');v=String(v);
    return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[keys.join(',')];
  people().forEach(p=>{const r=REC[p.id];if(!r||status(r)==='미착수')return;
    rows.push(keys.map(k=>esc(['nm','l4','by','co'].indexOf(k)>=0?(r[k]!=null&&r.manual?r[k]:p[k]):r[k])).join(','))});
  return '\ufeff'+rows.join('\n');
}
async function exportCsv(){
  const data=csv();
  if(data.split('\n').length<2){alert('아직 입력된 응답이 없습니다.');return}
  let dl=null;try{dl=await claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:'맬리브레인_팝업_응답_'+now().slice(0,10)+'.csv',data:data});return}catch(e){}}
  const w=$('#pane');w.innerHTML='';const i=el('div','inner');
  i.appendChild(el('div','sec','CSV (전체 선택해서 복사하세요)'));
  const t=document.createElement('textarea');t.value=data;t.style.minHeight='420px';
  i.appendChild(t);w.appendChild(i);t.select();
}
function paintCards(){
  const b3=allQ().find(x=>x.k==='b3'&&(x.o||[]).length)||allQ().find(x=>x.t==='many'&&(x.o||[]).length)||{o:GAMES};
  const cg=$('#cardgrid');cg.innerHTML='';
  (b3.o||[]).forEach(g=>cg.appendChild(el('div','gcard',g)));
}

/* ---------- boot ---------- */
function paintWho(){
  const s=$('#who');s.innerHTML='';
  const names=staffList().slice();
  if(staff&&names.indexOf(staff)<0)names.push(staff);
  const o0=document.createElement('option');o0.value='';o0.textContent='선택하세요';s.appendChild(o0);
  names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o)});
  const ox=document.createElement('option');ox.value='__x';ox.textContent='직접 입력...';s.appendChild(ox);
  s.value=staff||'';s.classList.toggle('unset',!staff);
}
$('#who').onchange=e=>{
  let v=e.target.value;
  if(v==='__x'){const t=prompt('이름을 입력하세요.',staff||'');v=(t||'').trim()}
  staff=v;localStorage.setItem('mb_staff',staff);paintWho();if(cur)openRec(cur);
};
$('#q').oninput=e=>{q=e.target.value.trim();$('#qwrap').classList.toggle('has',!!q);paintList()};
$('#qx').onclick=()=>{$('#q').value='';q='';$('#qwrap').classList.remove('has');$('#q').focus();paintList()};
$('#csvbtn').onclick=exportCsv;
$('#cardsbtn').onclick=()=>{paintCards();$('#cards').classList.add('on')};
$('#admbtn').onclick=openAdmin;
$('#addbtn').onclick=openAdd;
$('#acancel').onclick=()=>{if(confirm('편집한 내용을 버릴까요?'))closeAdmin()};
$('#asave').onclick=saveSchema;
$('#areset').onclick=()=>{if(confirm('기본 설문지로 되돌릴까요? 저장을 눌러야 현장에 반영됩니다.'))
  {const g=DEFAULT();DRAFT=clone(g);paintAdmin()}};

SCHEMA=lsGet('mb_schema',null)||DEFAULT();
if(!SCHEMA.staffList||!SCHEMA.staffList.length)SCHEMA.staffList=STAFF0.slice();
REC=lsGet('mb_rec',{});
rebuildExtra();paintWho();paintFilters();paintProg();paintList();
const ds=$('#dbstate');ds.textContent='이 기기에만 저장 중';
ds.style.cssText='background:var(--bBg);color:var(--b)';

(async()=>{
  try{USER=await claude.use('user')}catch(e){}
  canEdit=USER?USER.canEdit():null;
  if(canEdit!==false)$('#admbtn').style.display='';
  let db=null;try{db=await claude.use('db')}catch(e){}
  if(!db){ds.textContent='공유 저장 불가 · 이 기기에만 저장';return}
  DB=db;
  ds.textContent='여러 기기와 공유 중';ds.style.cssText='background:var(--aBg);color:var(--a)';
  db.doc('config/schema').onSnapshot(s=>{
    const v=s.data&&s.data();
    if(v&&v.s){SCHEMA=v;try{localStorage.setItem('mb_schema',JSON.stringify(v))}catch(e){}
      paintWho();if(cur&&!$('#admin').classList.contains('on'))openRec(cur)}
  },()=>{});
  db.collection('responses').onSnapshot(s=>{
    s.docs.forEach(d=>{const v=d.data();if(v&&v.id&&!dirty[v.id])REC[v.id]=v});
    try{localStorage.setItem('mb_rec',JSON.stringify(REC))}catch(e){}
    rebuildExtra();paintProg();paintList();
    if(cur&&!Object.keys(dirty).length&&!$('#admin').classList.contains('on')&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||''))openRec(cur,1);
  },e=>{ds.textContent='공유 끊김 ('+e.code+') · 이 기기에만 저장';
    ds.style.cssText='background:var(--cBg);color:var(--c)';DB=null});
  for(const r of Object.values(REC)){if(!r||!r.id)continue;
    try{await db.doc('responses/'+r.id).set(r)}catch(e){break}}
})();
