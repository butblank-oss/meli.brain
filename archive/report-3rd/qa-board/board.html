  if(accsOf(t).every(s=>R[s]&&R[s][k]))return v.every(x=>x==='해당없음')?'해당없음':'통과';return v.length?'진행 중':'미실행'}
const bugsOfT=tid=>[...(failAccs(tid).length?known(tid):[]),...autoBugs().filter(b=>b.tc===tid).map(b=>b.id)];
const refImg=f=>f?`<img src="shots/${esc(f)}" alt="개발과 피그마 비교 ${esc(f)}" loading="lazy" data-zoom>`:'<div class="none">참고 이미지 없음</div>';

/* ── 공유 상태 ── */
let db=null,assets=null,user=null,downloads=null,myId=null,canWrite=false;
const DOC={tc:{},bugs:{},dec:{}};
const chains={};
function write(col,id,patch){const p=col+'/'+id;chains[p]=(chains[p]||Promise.resolve()).then(async()=>{
  if(!db||!canWrite)return;const next={...(DOC[col][id]||{}),...patch};if(col==='tc'&&id.includes('@')&&!next.acct)next.acct=symOf(id.split('@')[1]);
  try{await db.doc(p).set(next)}catch(e){toast(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼습니다. 오래된 스크린샷을 지워 주세요':'저장하지 못했습니다. 잠시 후 다시 시도해 주세요');}});return chains[p]}
async function del(col,id){if(!db||!canWrite)return;try{await db.doc(col+'/'+id).delete()}catch(e){toast('삭제하지 못했습니다')}}
const timers={};
function writeSoon(col,id,patch){const k=col+'/'+id;timers[k]=Object.assign(timers[k]||{},{patch:{...((timers[k]||{}).patch||{}),...patch}});clearTimeout(timers[k].t);timers[k].t=setTimeout(()=>{const p=timers[k].patch;delete timers[k];write(col,id,p)},800)}

/* ── 결함 번호 ── */
const known=tid=>D.bugs.filter(b=>String(b.tc).split(/\s*·\s*/).includes(tid)).map(b=>b.id);
const autoBugs=()=>Object.entries(DOC.bugs).filter(([,b])=>b.auto).map(([id,b])=>({id,...b}));
const maxNum=()=>Math.max(10,...D.bugs.map(b=>+b.id.replace(/\D/g,'')),...Object.keys(DOC.bugs).map(x=>+x.replace(/\D/g,'')||0));
async function nextId(){const holder=myId||('v'+Math.random().toString(36).slice(2));const ref=db.doc('meta/seq');
  for(let i=0;i<6;i++){let r;try{r=await ref.acquire({holder,ttlMs:4000})}catch(e){break}
    if(r&&r.acquired){const s=await ref.get();const n=Math.max(maxNum(),(s.exists&&s.data().n)||0)+1;await ref.set({n});return 'BUG-'+String(n).padStart(2,'0')}
    await new Promise(ok=>setTimeout(ok,400+Math.random()*400))}
  return 'BUG-'+String(maxNum()+1).padStart(2,'0')}
/* 판정은 계정별로 따로 저장합니다: tc/<TC>@<계정> (예전 기록 tc/<TC> 는 그 안의 acct 로 읽음) */
const envOfR=R=>[R.some(r=>r.a==='실패')?'Android':'',R.some(r=>r.i==='실패')?'iOS':''].filter(Boolean).join(' · ');
const anyFail=R=>R.some(r=>r.a==='실패'||r.i==='실패');
async function setResult(tid,k,v){if(!canWrite){toast('이 화면에서는 저장할 수 없습니다');return}
  const t=D.tc.find(x=>x.id===tid),id=runId(tid,ACC),cur=DOC.tc[id]||{},nv=cur[k]===v?'':v;
  const before=failAccs(tid).length>0;await write('tc',id,{[k]:nv,date:today(),by:myId||''});
  const R={...runsOf(tid),[ACC]:{...cur,[k]:nv}};const all=Object.values(R),failed=anyFail(all),mine=autoBugs().filter(b=>b.tc===tid);
  if(failed&&!before){const kb=known(tid);
    if(kb.length)toast(`${tid}를 기존 ${kb.join(', ')}에 연결했습니다`);
    else if(!mine.length){const bid=await nextId();await write('bugs',bid,{auto:true,tc:tid,title:`${t.scr} — 기대 결과와 다름`,pr:t.pr,sev:SEV[t.pr],status:'개발 수정',env:envOfR(all),created:today(),by:myId||''});toast(`${bid}를 만들었습니다. 결함 탭에서 제목만 다듬으세요`)}}
  else if(failed&&nv==='실패'){const b=[...known(tid),...mine.map(x=>x.id)];if(b.length)toast(`${accShort(ACC)} 결과도 ${b.join(', ')}에 묶었습니다`)}
  else if(!failed&&before){for(const m of mine)if(!m.edited){await del('bugs',m.id);toast(`${m.id}를 지웠습니다 (실패 해제)`)}}
  if(failed)for(const m of mine)if(m.env!==envOfR(all))write('bugs',m.id,{env:envOfR(all)})}
async function newBugFor(tid){if(!canWrite)return;const t=D.tc.find(x=>x.id===tid);const id=await nextId();
  await write('bugs',id,{auto:true,tc:tid,title:`${t.scr} — 기대 결과와 다름`,pr:t.pr,sev:SEV[t.pr],status:'개발 수정',env:envOfR(Object.values(runsOf(tid))),created:today(),by:myId||'',edited:true});
  toast(`${id}를 만들었습니다`);goBug(id)}

/* ── 스크린샷 ── */
function shrink(file){return new Promise(ok=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const m=1440,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>ok(b),'image/jpeg',.86)};im.onerror=()=>{URL.revokeObjectURL(u);ok(null)};im.src=u})}
async function addFiles(key,files){if(!assets){toast('이 화면에서는 스크린샷을 올릴 수 없습니다');return}
  const imgs=[...files].filter(f=>f.type&&f.type.startsWith('image/'));if(!imgs.length)return;const [col,id]=key.split(':');
  const st=(document.querySelector(`[data-drop="${key}"]`)||{closest:()=>null}).closest('.cmpbox')?.querySelector('.busy');if(st)st.textContent=` 올리는 중… (${imgs.length}장)`;
  const ids=[];for(const f of imgs){const b=await shrink(f);if(!b)continue;try{const r=await assets.upload(b,{type:'image/jpeg'});ids.push(r.id)}catch(e){toast(e&&e.code==='too_large'?'파일이 너무 큽니다':e&&e.code==='quota_or_state'?'저장 공간이 가득 찼습니다':'스크린샷을 올리지 못했습니다')}}
  if(st)st.textContent='';if(!ids.length)return;
  sel[key]=ids[ids.length-1];await write(col,id,{shots:[...((DOC[col][id]||{}).shots||[]),...ids]});paintShots(key);toast(`${id}에 앱 캡처 ${ids.length}장을 올렸습니다`)}
const armed={};
async function removeShot(key,aid){const k=key+'|'+aid;if(!armed[k]){armed[k]=1;paintShots(key);setTimeout(()=>{delete armed[k];paintShots(key)},3000);return}
  delete armed[k];const [col,id]=key.split(':');await write(col,id,{shots:((DOC[col][id]||{}).shots||[]).filter(x=>x!==aid)});try{await assets.delete(aid)}catch(e){}}
const figSrc=k=>k?`fig/fig_${k}.png`:'';const sel={};
const cmpHtml=(key,fk,cmpFile)=>`<div class="cmpbox">
 <div class="col"><div class="cap"><span class="tag">피그마 목업</span></div><div class="frame">${fk?`<img src="${figSrc(fk)}" alt="피그마 목업" data-zoom loading="lazy">`:'<div class="none">이 TC는 피그마 목업이 없습니다<br>앱 화면만 확인하세요</div>'}</div></div>
 <div class="col"><div class="cap"><span class="tag app">앱 캡처</span><span class="busy"></span></div><div class="drop frame" tabindex="0" data-drop="${key}" aria-label="앱 캡처 올리기"><div data-main="${key}" style="height:100%;width:100%;display:flex;align-items:center;justify-content:center"></div></div></div></div>
 <div class="ups" data-ups="${key}"></div>
 <div class="tools"><button class="btn" data-sbs="${key}" data-fig="${fk||''}">나란히 크게 보기</button>${assets&&canWrite?`<label class="btn">캡처 올리기<input type="file" accept="image/*" multiple hidden data-file="${key}"></label>`:''}${cmpFile?`<button class="btn" data-zoomsrc="shots/${cmpFile}">개발 웹 샘플 비교 (기획 확인)</button>`:''}</div>`;
const curShot=key=>{const [col,id]=key.split(':');const arr=(DOC[col][id]||{}).shots||[];return arr.includes(sel[key])?sel[key]:arr[arr.length-1]};
function paintShots(key){const [col,id]=key.split(':');const arr=(DOC[col][id]||{}).shots||[];const c=curShot(key);
  const m=document.querySelector(`[data-main="${key}"]`);if(m){const mh=c?`<img src="${blob(c)}" alt="${esc(id)} 앱 캡처" data-zoom>`:`<div class="hint">${assets&&canWrite?'여기를 누르고 <b>Ctrl+V</b>(맥 ⌘V)로 붙여넣기<br>또는 끌어놓기 · [캡처 올리기]':'아직 올린 캡처가 없습니다'}</div>`;if(m.dataset.h!==mh){m.innerHTML=mh;m.dataset.h=mh}}
  const el=document.querySelector(`[data-ups="${key}"]`);if(!el)return;
  const html=arr.length>1||(arr.length&&assets&&canWrite)?arr.map(a=>`<div class="up${a===c?' sel':''}"><img src="${blob(a)}" alt="${esc(id)} 캡처" data-selshot="${key}" data-aid="${a}" loading="lazy">${assets&&canWrite?`<button class="x" data-rm="${key}" data-aid="${a}" aria-label="캡처 삭제">${armed[key+'|'+a]?'삭제?':'✕'}</button>`:''}</div>`).join(''):'';
  if(el.dataset.html!==html){el.innerHTML=html;el.dataset.html=html}}
let lastDrop=null;
document.addEventListener('focusin',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d)lastDrop=d.dataset.drop});
document.addEventListener('paste',e=>{const d=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('[data-drop]');const k=d?d.dataset.drop:lastDrop;if(!k)return;const f=[...((e.clipboardData&&e.clipboardData.files)||[])];if(f.length){e.preventDefault();addFiles(k,f)}});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('over')}});

document.addEventListener('click',e=>{const z=e.target.closest('[data-zoom]');if(z){zoomIt(z.src);return}
  const rm=e.target.closest('[data-rm]');if(rm){removeShot(rm.dataset.rm,rm.dataset.aid);return}
  const ss=e.target.closest('[data-selshot]');if(ss){sel[ss.dataset.selshot]=ss.dataset.aid;paintShots(ss.dataset.selshot);return}
  const sb=e.target.closest('[data-sbs]');if(sb){const c=curShot(sb.dataset.sbs);sideBySide(sb.dataset.fig?figSrc(sb.dataset.fig):'',c?blob(c):'');return}
  const zs=e.target.closest('[data-zoomsrc]');if(zs){zoomIt(zs.dataset.zoomsrc);return}

document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.col)return;const patch={[el.dataset.f]:el.value};if(el.dataset.col==='bugs')patch.edited=true;writeSoon(el.dataset.col,el.dataset.id,patch)});

  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3기 리포트 결함 리포트 ${day}</title><style>body{font:14px/1.55 -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#17201C;max-width:980px;margin:0 auto;padding:24px 16px;background:#fff}h1{font-size:22px}h2{font-size:17px;margin:0}h2 small{font-weight:500;color:#C2410C;margin-left:6px}h3{font-size:15px;margin:4px 0 10px}.b{border:1px solid #DDE3E0;border-radius:12px;padding:16px;margin:14px 0}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ECEFEE;padding:6px 8px;text-align:left;vertical-align:top}th{width:110px;color:#7D8A84;font-weight:500}.imgs{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}.imgs figure{margin:0;width:260px}.imgs .ref{width:420px}.imgs img{width:100%;border:1px solid #DDE3E0;border-radius:8px}figcaption{font-size:12px;color:#7D8A84}.sum{background:#F4F6F5;border-radius:12px;padding:12px 16px}.tc td,.tc th{font-size:12px;width:auto}</style></head><body><h1>3기 종료 리포트 — 결함 리포트</h1><p>작성 ${day} · 기준 피그마 목업 + 디스크립션 (페이지 1028:3313) · dev 10/7 빌드</p><div class="sum">열린 결함 <b>${open.length}건</b> (새로 생긴 결함 ${A.length}) · P1 실패 TC <b>${p1f}건</b></div>${cards.join('')}<h2 style="margin-top:28px">TC 결과 (계정별)</h2><table class="tc"><tr><th>TC</th><th>우선</th><th>화면</th><th>계정</th><th>Android</th><th>iOS</th><th>결함</th><th>오류 유형</th><th>다른 점</th></tr>${rows}</table></body></html>`;
  try{await downloads.save({filename:`3기리포트_결함리포트_${day}.html`,data:new Blob([html],{type:'text/html'})});toast('결함 리포트를 내려받았습니다')}catch(e){toast('내려받기를 취소했거나 할 수 없습니다')}}

/* ── 시작 ── */
function renderAll(){patchAcc();stats();if(!$('#v-tc').innerHTML)tcList();else patchTc();if(cur==='bug')bugs();patchDec()}
staticTabs();stats();tcList();showTab('tc');
(async()=>{
  try{db=await claude.use('db')}catch(e){db=null}
  try{user=await claude.use('user')}catch(e){user=null}
  try{assets=await claude.use('assets')}catch(e){assets=null}
  try{downloads=await claude.use('downloads')}catch(e){downloads=null}
  try{myId=user&&user.id?await user.id():null}catch(e){myId=null}
  let w=null;try{w=user&&user.can?await user.can('data.write'):null}catch(e){}
  canWrite=!!db&&w!==false;
  const bn=$('#banner');
  if(!db){bn.className='banner warn';bn.textContent='저장소에 연결하지 못했습니다. claude.ai에 로그인한 상태로 이 페이지를 열어 주세요. 지금은 읽기만 됩니다.'}
  else if(!canWrite){bn.className='banner';bn.textContent='보기 권한으로 열었습니다. 결과 입력과 스크린샷 업로드는 편집 권한이 있는 사람만 할 수 있습니다.'}
  else{bn.className='banner';bn.textContent=assets?'연결됨 — 입력과 스크린샷이 이 페이지에 바로 저장됩니다.':'연결됨 — 결과는 저장되지만 이 화면에서는 스크린샷을 올릴 수 없습니다.'}
  tcList();bugSig='';if(cur==='bug')bugs();
  if(!db)return;
  for(const col of ['tc','bugs','dec']){db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});DOC[col]=o;renderAll()},e=>{bn.className='banner warn';bn.textContent='저장소 연결이 끊겼습니다. 페이지를 새로 고쳐 주세요.'})}
  patchTc();
})();
</script>
