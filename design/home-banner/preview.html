<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
body{margin:0;background:#F4F6F5;font-family:Pretendard,-apple-system,sans-serif}
.phone{width:375px;padding:24px 0;background:#F7F8F8}
.card{margin:0 16px;height:80px;border-radius:16px;background:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.card.mint{background:#E3F2EB}
.thumb{width:56px;height:56px;border-radius:8px;overflow:hidden;flex:none;background:#E9F8F2}
.thumb img{width:56px;height:56px;display:block}
.txt{flex:1;display:grid;gap:4px}
.t1{font-size:17px;font-weight:700;color:#191F28;line-height:1.2}
.t2{font-size:14px;color:#6B7684;line-height:1.2}
.chev{color:#9AA3AD;font-size:22px}
.lbl{font-size:12px;color:#6B7684;margin:16px 16px 6px}
</style>
<div class="phone">
<div class="lbl">흰 카드 · 썸네일 바탕 #E9F8F2</div>
<div class="card"><div class="thumb"><img src="thumb.svg"></div><div class="txt"><span class="t1">3기 리포트가 도착했어요</span><span class="t2">8개월의 기록을 확인해보세요</span></div><span class="chev">›</span></div>
<div class="lbl">민트 카드 · 썸네일 바탕 투명</div>
<div class="card mint"><div class="thumb" style="background:transparent"><img src="thumb.svg"></div><div class="txt"><span class="t1">3기 리포트가 도착했어요</span><span class="t2">8개월의 기록을 확인해보세요</span></div><span class="chev">›</span></div>
<div class="lbl">원본 224 × 224 (모서리 8pt=32px 마스크)</div>
<div style="margin:0 16px;display:flex;gap:16px"><img src="thumb.svg" style="width:112px;height:112px;border-radius:16px;background:#E9F8F2"><img src="thumb.svg" style="width:112px;height:112px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px"></div>
</div>
