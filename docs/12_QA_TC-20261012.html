const RES=['통과','실패','보류','해당없음'];
const img=f=>f?`<img src="qa/${esc(f)}" alt="${esc(f)}" loading="lazy" onclick="zoomIt(this.src)">`:'<div class="none">스크린샷 없음<br>앱에서 캡처 후 링크 입력</div>';
function zoomIt(src){const z=document.getElementById('zoom');z.querySelector('img').src=src;z.style.display='flex'}
const TABS=[['tc','TC ('+D.tc.length+')'],['bug','결함 ('+D.bugs.length+')'],['dec','결정 필요 ('+D.dec.length+')'],['data','데이터 요청'],['shot','스크린샷 비교'],['guide','계정 · 안내']];
document.getElementById('tabs').innerHTML=TABS.map(([k,n],i)=>`<button class="tab${i?'':' on'}" data-k="${k}">${n}</button>`).join('');
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('section').forEach(s=>s.classList.toggle('hidden',s.id!=='v-'+b.dataset.k));};
let F={pr:'',stage:'',res:''};
function stats(){const by=p=>D.tc.filter(t=>!p||t.pr===p);const r=t=>(S[t.id]||{}).a||'';
 const cnt=(arr,v)=>arr.filter(t=>r(t)===v).length;const p1=by('P1');const f1=cnt(p1,'실패'),done1=p1.filter(t=>r(t)).length;
 const v=f1?`배포 불가 — P1 실패 ${f1}건`:(done1<p1.length?`판단 보류 — P1 미완료 ${p1.length-done1}건`:'배포 가능 — P1 전부 통과');
 document.getElementById('stats').innerHTML=['P1','P2','P3'].map(p=>{const a=by(p);return `<div class="stat"><span>${p} · ${D.pri.find(x=>x.p===p).name}</span><b>${cnt(a,'통과')} / ${a.length}</b><span>실패 ${cnt(a,'실패')} · 보류 ${cnt(a,'보류')}</span></div>`}).join('')
 +`<div class="stat"><span>결함</span><b>${D.bugs.length}</b><span>결정 필요 ${D.dec.length}</span></div><div class="stat verdict" style="color:${f1?'var(--fail)':'var(--ink)'}">${v} <span class="note">(Android 결과 기준)</span></div>`;}
function tc(){const stages=[...new Set(D.tc.map(t=>t.stage))];
 const list=D.tc.filter(t=>(!F.pr||t.pr===F.pr)&&(!F.stage||t.stage===F.stage)&&(!F.res||((S[t.id]||{}).a||'미실행')===F.res));
 document.getElementById('v-tc').innerHTML=`<div class="bar"><select id="fp"><option value="">우선순위 전체</option>${['P1','P2','P3'].map(p=>`<option ${F.pr===p?'selected':''}>${p}</option>`).join('')}</select>
 <select id="fs"><option value="">여정 전체</option>${stages.map(s=>`<option ${F.stage===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
 <select id="fr"><option value="">결과 전체</option>${['미실행',...RES].map(s=>`<option ${F.res===s?'selected':''}>${s}</option>`).join('')}</select>
 <button class="btn pri" onclick="csv()">CSV 내보내기</button><button class="btn" onclick="if(confirm('입력한 결과를 모두 지울까요?')){S={};save();render()}">초기화</button><span class="note">${list.length}건</span></div>`
 +list.map(t=>{const s=S[t.id]||{};return `<div class="card"><div class="row"><div>
 <div class="hd"><span class="id">${t.id}</span><span class="pill ${t.pr}">${t.pr}</span><span class="pill">${esc(t.stage)}</span><span class="pill">${esc(t.scr)}</span><span class="pill">계정 ${esc(t.acc)}</span><span class="pill">${esc(t.env)}</span></div>
 <dl>${t.pre&&t.pre!=='—'?`<dt>사전 조건</dt><dd>${esc(t.pre)}</dd>`:''}<dt>절차</dt><dd>${esc(t.step)}</dd><dt>기대 결과</dt><dd><b>${esc(t.exp)}</b></dd><dt>근거</dt><dd class="note">${esc(t.ref)}</dd></dl>
 ${t.web?`<div class="webres">기획 웹 샘플 확인 · <b>${esc(t.web)}</b>${t.webm?' — '+esc(t.webm):''}</div>`:''}
 ${['a','i'].map(k=>`<div class="res"><label>${k==='a'?'Android':'iOS'}</label>${RES.map(v=>`<button class="rb${s[k]===v?' on':''}" data-id="${t.id}" data-k="${k}" data-v="${v}">${v}</button>`).join('')}</div>`).join('')}
 <div class="res" style="gap:6px"><input type="text" placeholder="결함 ID (예: BUG-06)" value="${esc(s.bug||'')}" data-id="${t.id}" data-f="bug" style="width:150px"><input type="text" placeholder="증빙 스크린샷 링크" value="${esc(s.link||'')}" data-id="${t.id}" data-f="link" style="flex:1;min-width:160px"></div>
 <textarea placeholder="실제 결과 · 메모" data-id="${t.id}" data-f="memo">${esc(s.memo||'')}</textarea>
 </div><div class="shot">${img(t.shot)}</div></div></div>`}).join('');
 document.getElementById('fp').onchange=e=>{F.pr=e.target.value;tc()};document.getElementById('fs').onchange=e=>{F.stage=e.target.value;tc()};document.getElementById('fr').onchange=e=>{F.res=e.target.value;tc()};}
document.addEventListener('click',e=>{const b=e.target.closest('.rb');if(!b)return;const o=g(b.dataset.id);o[b.dataset.k]=o[b.dataset.k]===b.dataset.v?'':b.dataset.v;o.date=new Date().toISOString().slice(0,10);save();
 b.parentNode.querySelectorAll('.rb').forEach(x=>x.classList.toggle('on',x.dataset.v===o[b.dataset.k]));stats();});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.f)return;g(el.dataset.id)[el.dataset.f]=el.value;save();});
function bug(){document.getElementById('v-bug').innerHTML=D.bugs.map(b=>{const s=S[b.id]||{};return `<div class="card"><div class="row"><div>
 <div class="hd"><span class="id">${b.id}</span><span class="pill ${b.pr}">${b.pr}</span><span class="pill">${esc(b.sev)}</span><b>${esc(b.title)}</b></div>
 <dl><dt>화면</dt><dd>${esc(b.scr)}</dd><dt>재현 경로</dt><dd>${esc(b.path)}</dd><dt>기대</dt><dd>${esc(b.exp)}</dd><dt>실제</dt><dd><b>${esc(b.act)}</b></dd><dt>근거</dt><dd class="note">${esc(b.ref)}</dd><dt>담당</dt><dd>${esc(b.owner)}</dd><dt>관련 TC</dt><dd>${esc(b.tc)}</dd>
 <dt>상태</dt><dd><select data-id="${b.id}" data-f="status">${['기획 선행','확인 필요','개발 수정','수정 완료','재검수 실패','해결','보류'].map(v=>`<option ${(s.status||b.status)===v?'selected':''}>${v}</option>`).join('')}</select></dd></dl>
 <textarea placeholder="메모 · 회신" data-id="${b.id}" data-f="memo">${esc(s.memo||'')}</textarea></div><div class="shot">${img(b.shot)}</div></div></div>`}).join('');}
document.addEventListener('change',e=>{const el=e.target;if(el.tagName==='SELECT'&&el.dataset.f){g(el.dataset.id)[el.dataset.f]=el.value;save();}});
function dec(){document.getElementById('v-dec').innerHTML=D.dec.map(d=>{const s=S[d.id]||{};return `<div class="card"><div class="hd"><span class="id">${d.id}</span><b>${esc(d.title)}</b><span class="pill P1">기한 ${esc(d.due)}</span></div>
 <dl><dt>지금 상태</dt><dd>${esc(d.now)}</dd><dt>선택지</dt><dd>${esc(d.opts)}</dd><dt>근거</dt><dd class="note">${esc(d.ref)}</dd></dl><textarea placeholder="결정 내용" data-id="${d.id}" data-f="memo">${esc(s.memo||'')}</textarea></div>`}).join('');}
function data(){document.getElementById('v-data').innerHTML=`<div class="tablewrap"><table><tr><th>#</th><th>요청 (개발)</th><th>왜</th><th>관련 TC</th></tr>${D.data.map(d=>`<tr><td>${d.n}</td><td>${esc(d.req)}</td><td>${esc(d.why)}</td><td>${esc(d.tc)}</td></tr>`).join('')}</table></div>`;}
function shot(){const L=[['cmp_08_done.png','4기 신청 완료 — 개발(왼쪽) · 기획(오른쪽) · BUG-01 · 02 · 05'],['cmp_01_cover.png','표지 — 개발(왼쪽) · 기획(오른쪽) · BUG-03 · 04']];
 const S2=[['dev_01_cover.png','01 표지'],['dev_02.png','02 숫자로 먼저'],['dev_03.png','03 집중의 리듬'],['dev_04.png','04 게임'],['dev_04B.png','04B 랭킹'],['dev_05.png','05 마음'],['dev_06.png','06 걸음'],['dev_07_A.png','07 A 수료증'],['dev_07_B.png','07 B 참여기록'],['dev_07_C.png','07 C 참여확인'],['dev_07h_sheet.png','07-h 확인 시트'],['dev_07_l.png','07-l 신청 완료 후'],['dev_08_done.png','08 신청 완료'],['dev_P20.png','P20 비대상'],['dev_form4_landing.png','신청폼 4기 첫 화면'],['dev_form4_form.png','신청폼 4기 입력'],['dev_form3_landing.png','신청폼 3기 첫 화면']];
 document.getElementById('v-shot').innerHTML=`<p class="note">빨간 테두리 = 개발 dev · 초록 테두리 = 기획 프로토타입. 이미지를 누르면 크게 보입니다.</p><div class="cmp" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${L.map(([f,c])=>`<figure>${img(f)}<figcaption>${c}</figcaption></figure>`).join('')}</div>
 <h3>개발 서버 웹 샘플 (360×740)</h3><div class="cmp">${S2.map(([f,c])=>`<figure>${img(f)}<figcaption>${c}</figcaption></figure>`).join('')}</div>`;}
function guide(){document.getElementById('v-guide').innerHTML=`<h3>테스트 계정</h3><div class="tablewrap"><table><tr><th></th><th>번호</th><th>이름</th><th>등급</th><th>주로 볼 것</th></tr>${D.acc.map(a=>`<tr><td>${a.k}</td><td>${a.tel}</td><td>${esc(a.name)}</td><td>${esc(a.tier)}</td><td>${esc(a.see)}</td></tr>`).join('')}</table></div>
 <h3>우선순위</h3><div class="tablewrap"><table>${D.pri.map(p=>`<tr><td><b>${p.p}</b></td><td>${p.name}</td><td>${esc(p.desc)}</td></tr>`).join('')}</table></div>
 <h3>쓰는 법</h3><ol><li>앱에서 TC를 돌리고 Android · iOS 결과 버튼을 누릅니다. 다시 누르면 해제됩니다.</li><li>실패면 결함 탭의 BUG 번호를 적거나 새 번호(BUG-06~)를 적고, 증빙 스크린샷 링크를 붙입니다.</li><li>입력값은 <b>이 브라우저에만</b> 저장됩니다. 다른 사람과 맞추려면 <b>CSV 내보내기</b> → 스프레드시트 TC 시트에 붙여 넣으세요.</li><li>신청폼 4기는 제출하면 실제 문자가 갑니다. <b>본인 번호로만</b> 1회 제출합니다.</li></ol>
 <p class="note">스프레드시트: <a href="qa/3기리포트_QA_TC_20261012.xlsx">3기리포트_QA_TC_20261012.xlsx</a></p>`;}
function csv(){const H=['TC ID','우선순위','여정 단계','화면','결과 Android','결과 iOS','실제 결과','결함 ID','증빙 스크린샷 링크','테스트일'];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=D.tc.map(t=>{const s=S[t.id]||{};return [t.id,t.pr,t.stage,t.scr,s.a||'미실행',s.i||'',s.memo||'',s.bug||'',s.link||'',s.date||'']});
 const blob=new Blob(['﻿'+[H,...rows].map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='3기리포트_QA_결과.csv';a.click();}
function render(){stats();tc();bug();dec();data();shot();guide();}render();
</script></body></html>
