<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3기 수료식 안내 프로토타입</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
  :root{
    --green:#265F4D; --mint:#5BBE97; --lmint:#DDF1E6; --cream:#FFF7EF; --yellow:#FFD54A; --syellow:#FFF3CC;
    --ink:#111; --sub:#4A4A50; --gray:#8A8A8E; --line:#ECECEE; --btn:#13BD7E; --amber:#E8A800;
  }
  *{box-sizing:border-box}
  body,button,select{word-break:keep-all;overflow-wrap:break-word}
  body{margin:0;background:#181B20;color:#1A1F26;-webkit-text-size-adjust:100%;
    font-family:'Pretendard Variable',Pretendard,"Noto Sans KR",-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif}
  button,select{font-family:inherit}
  @keyframes sp{to{transform:rotate(360deg)}}
  @keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

  .wrap{display:flex;align-items:flex-start;min-height:100vh}
  /* ── 검수 패널 ── */
  .panel{width:296px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;background:#14171B;color:#C6CCD3;padding:20px 18px 64px;font-size:13px;line-height:1.6}
  .panel h1{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.02em;margin:0}
  .panel .lead{font-size:11.5px;color:#7C848D;line-height:1.7;margin:6px 0 18px}
  .sec{border-top:1px solid #242930;padding-top:14px;margin-bottom:16px}
  .lab{font-size:11px;font-weight:700;color:#9DB6D2;letter-spacing:.06em;margin-bottom:8px}
  .lab.gold{color:#C9A227}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .pbtn{background:#1D2228;color:#C6CCD3;border:1px solid #2E353D;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}
  .pbtn:hover{border-color:#4A5561;color:#fff}
  .pbtn.on{background:#2F4A6B;border-color:#4B6E96;color:#fff}
  .seg{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
  .seg .pbtn{flex:1;padding:7px 4px;text-align:center}
  .row-l{font-size:11px;color:#7C848D;margin:2px 0 4px}
  .panel select{width:100%;background:#1D2228;color:#E7EBEF;border:1px solid #2E353D;border-radius:8px;padding:9px 10px;font-size:12.5px}
  .pdesc{font-size:11.5px;color:#89929B;line-height:1.8;margin:10px 0 0}
  .rules{font-size:11.5px;color:#7C848D;line-height:1.9;background:#1D2228;border:1px solid #242930;border-radius:10px;padding:12px 13px}
  .log{background:#0F1215;border:1px solid #242930;border-radius:10px;padding:8px 10px;font:11px/1.6 ui-monospace,Menlo,monospace;color:#9BE3C3;max-height:220px;overflow:auto}
  .log div{border-bottom:1px dashed #20262C;padding:3px 0}
  .log .t{color:#6B7580}
  .log .e{color:#FFD54A;font-weight:700}
  .link{display:block;margin-top:9px;font-size:11.5px;color:#6EE7B7;text-decoration:none;font-weight:700}

  /* ── 폰 ── */
  main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:28px 20px 96px;min-width:0}
  .phone{width:390px;max-width:100%;height:844px;background:#F6F6F4;box-shadow:0 26px 70px rgba(0,0,0,.45);position:relative;overflow:hidden;border-radius:6px;display:flex;flex-direction:column}
  .sbar{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:15px;font-weight:700;background:#fff}
  .scroll{flex:1;overflow-y:auto;padding:6px 16px 24px}
  .apptitle{font-size:22px;font-weight:800;letter-spacing:0;margin:10px 4px 14px;color:var(--ink)}
  .card{background:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
  .card h3{font-size:18px;margin:0 0 6px;font-weight:800}
  .card p{margin:0;font-size:17px;color:var(--sub)}
  .steps{font-size:30px;font-weight:800;color:var(--ink)}
  .act{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:17px;font-weight:700}
  .act:first-of-type{border-top:0}
  .act i{width:40px;height:40px;border-radius:12px;background:var(--lmint);flex-shrink:0;display:grid;place-items:center;font-style:normal;font-size:19px}
  .tabbar{height:72px;flex-shrink:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;font-size:13px;color:var(--gray);font-weight:700}
  .tabbar span.on{color:var(--green)}

  /* 배너 */
  .banner{position:relative;display:block;width:100%;text-align:left;border:0;cursor:pointer;background:var(--green);border-radius:20px;padding:20px 20px 18px;color:#fff;overflow:hidden;margin-bottom:12px;min-height:150px}
  .banner:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
  .banner .pill{display:inline-block;background:var(--yellow);color:#3A2C00;border-radius:999px;padding:5px 11px;font-size:14px;font-weight:800}
  .banner .tt{font-size:24px;font-weight:800;line-height:1.3;margin:10px 0 10px;position:relative;z-index:1}
  .banner .go{font-size:16px;font-weight:700;color:#E7F7EF;position:relative;z-index:1}
  .banner .circle{position:absolute;right:-26px;top:22px;width:150px;height:150px;border-radius:50%;background:var(--mint);opacity:.9}
  .banner .gift{position:absolute;right:22px;top:52px;width:70px;height:58px}
  .banner.pressed{transform:scale(.98)}

  /* 모달 */
  .dim{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20}
  .modal{width:329px;max-height:800px;overflow-y:auto;background:#fff;border-radius:24px;animation:up .25s ease-out;box-shadow:0 18px 40px rgba(0,0,0,.25)}
  .hero{background:var(--green);color:#fff;padding:24px 22px 22px;position:relative;overflow:hidden}
  .hero .spark{position:absolute;color:var(--yellow);font-size:14px}
  .hero .eb{font-size:15px;font-weight:700;color:#CFEBDD}
  .hero .eb.today{color:var(--green);background:var(--yellow);display:inline-block;border-radius:999px;padding:4px 11px;font-weight:800}
  .hero h2{font-size:28px;font-weight:800;line-height:1.3;margin:8px 0 0}
  .hero .check{width:56px;height:56px;border-radius:50%;background:var(--mint);display:grid;place-items:center;margin-bottom:12px}
  .body{padding:18px 22px 6px}
  .sub{font-size:17px;color:var(--sub);line-height:1.55;margin:0 0 14px;font-weight:600}
  .info{border-top:1px solid var(--line)}
  .info div{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .info span{width:56px;flex-shrink:0;font-size:16px;color:var(--gray);font-weight:600}
  .info b{font-size:18px;font-weight:800;color:var(--ink);line-height:1.4}
  .coupon{display:flex;align-items:center;gap:12px;margin:14px 0 4px;background:var(--syellow);border-radius:14px;padding:12px 14px;position:relative}
  .coupon .ic{width:40px;height:40px;border-radius:10px;background:var(--yellow);display:grid;place-items:center;font-size:20px;flex-shrink:0}
  .coupon small{display:block;font-size:14px;color:#6B5200;font-weight:700}
  .coupon strong{display:block;font-size:18px;font-weight:800;color:var(--ink)}
  .acts{padding:14px 22px 18px;display:flex;flex-direction:column;gap:6px}
  .primary{width:100%;min-height:60px;border:0;border-radius:14px;background:var(--btn);color:#fff;font-size:20px;font-weight:800;cursor:pointer}
  .primary:active{filter:brightness(.92)}
  .primary.busy{opacity:.6;cursor:progress;display:flex;align-items:center;justify-content:center;gap:10px}
  .primary.done{background:var(--lmint);color:var(--green);cursor:default}
  .primary.danger{background:#E5484D}
  .spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
  .secondary{width:100%;min-height:52px;border:0;background:none;color:var(--gray);font-size:17px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .secondary[disabled]{opacity:.4;cursor:default}
  .chipset{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
  .chip{min-height:48px;padding:0 16px;border-radius:999px;border:1.5px solid #D6D6DA;background:#fff;font-size:17px;font-weight:700;color:var(--sub);cursor:pointer}
  .chip.on{border-color:var(--green);background:var(--lmint);color:var(--green)}
  .qa{font-size:15px;color:var(--gray);font-weight:600;margin:6px 0 8px}
  .tel{display:block;background:#F4F4F6;border-radius:12px;padding:12px 14px;font-size:16px;color:var(--sub);font-weight:600;margin-bottom:6px}
  .tel b{color:var(--ink);font-size:18px;white-space:nowrap}

  .empty-note{background:#FFF8E5;border:1px dashed #E0C36E;color:#6B5200;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;margin-bottom:12px}
  .push{position:absolute;left:10px;right:10px;top:10px;z-index:40;display:flex;gap:10px;align-items:center;background:rgba(250,250,252,.96);backdrop-filter:blur(8px);border-radius:18px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .25s}
  .push .pi{width:36px;height:36px;border-radius:9px;background:#34C759;color:#fff;display:grid;place-items:center;font-size:18px;flex-shrink:0}
  .push b{display:block;font-size:13px;color:#111}
  .push span{display:block;font-size:14px;color:#333;font-weight:600}
  .push em{margin-left:auto;font-style:normal;font-size:12px;color:#8A8A8E;align-self:flex-start}
  .smsbox{white-space:pre-wrap;background:#E5E5EA;border-radius:14px;padding:12px 13px;font-size:12.5px;line-height:1.65;color:#111}
  .toast{position:absolute;left:16px;right:16px;bottom:88px;background:#1E2226;color:#fff;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;z-index:30;animation:up .2s}

  /* ── 화면 설명 ── */
  .notes{width:344px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;background:#E9EDF2;padding:20px 16px 64px;display:flex;flex-direction:column;gap:10px}
  .notes .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
  .notes .hd b{font-size:15px;font-weight:800;color:#22384F}
  .notes .hd p{font-size:11.5px;color:#5A7391;line-height:1.7;margin:5px 0 0}
  .notes .x{flex-shrink:0;width:32px;height:32px;border-radius:8px;border:1px solid #C6D0DC;background:#fff;color:#5A7391;font-size:15px;font-weight:800;cursor:pointer;margin-left:auto}
  .nc{background:#fff;border:1px solid #C6D0DC;border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
  .nc.warn{border-color:#E0C36E;background:#FFFBEF}
  .nc .h{display:flex;align-items:baseline;gap:7px}
  .nc .id{font-size:10.5px;font-weight:800;color:#fff;background:#2F4A6B;border-radius:5px;padding:3px 6px;flex-shrink:0}
  .nc.warn .id{background:#A9701A}
  .nc .h b{font-size:13.5px;font-weight:800;color:#1A2A3C}
  .kv{display:flex;gap:9px;font-size:12.5px;line-height:1.65;color:#31445A}
  .kv span:first-child{flex-shrink:0;width:46px;font-weight:800;color:#5A7391}
  .kv span:last-child{flex:1;min-width:0;overflow-wrap:anywhere}


  /* Figma 이미지 위 탭 영역 */
  .phone{width:393px;height:852px;background:#F7F7F7}
  .scroll{padding:0;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  .home{position:relative;width:393px}
  .home img,.mimg img{display:block;user-select:none}
  .hs{position:absolute;display:block;background:transparent;border:0;border-radius:14px;cursor:pointer;padding:0}
  .hs:hover{background:rgba(0,0,0,.06)}
  .hs:active{background:rgba(0,0,0,.12)}
  .hs:focus-visible{outline:3px solid #FFD54A;outline-offset:2px}
  .showhs .hs{outline:2px dashed #FF4D8D;outline-offset:-2px;background:rgba(255,77,141,.12)}
  .mimg{position:relative;width:329px;border-radius:24px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.28)}
  .mimg.anim{animation:up .25s ease-out}
  .dim{background:rgba(0,0,0,.5)}
  .chipx{position:absolute;border:2px solid transparent;box-shadow:inset 0 0 0 1.5px #E2E2E5;background-clip:padding-box;background:#fff;border-radius:16px;font-family:inherit;font-size:18px;font-weight:700;line-height:1;color:#1A1A1A;cursor:pointer;padding:0}
  .chipx.on{box-shadow:inset 0 0 0 3px #265F4D;background:#E2F2E9;color:#265F4D}
  .busy{position:absolute;border-radius:16px;background:#8ADDBE;color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
  @media (max-width:1100px){.notes{display:none}}
  @media (max-width:760px){.wrap{flex-direction:column}.panel{position:static;width:100%;height:auto}main{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="panel" id="panel"></aside>
  <main><div class="phone" id="phone"></div></main>
  <aside class="notes" id="notes"></aside>
</div>

<script>
/* ════════════════════════════════════════════════════
   3기 수료식 초대 · 앱 배너 + 안내 모달 · 안내형 v3.0 (최종)
   신청 · 저장 · 문자 없음. "다시 보지 않기"는 폰에 기록.
   화면 = Figma(1929:1241) 2배 PNG + 투명 탭 영역.
   ════════════════════════════════════════════════════ */
const EVENT_ID = '2026-10-30-namdong-3rd';
const S = {
  period:'auto',     // banner(10/16~10/26: 배너 탭해야 모달) | auto(10/27~10/30 17시: 접속 시 자동 노출) | closed(10/30 17시~)
  cohort:true,
  never:false,       // false | 'pre'(10/27 전에 누름: 무시) | 'auto'(자동 노출 기간에 누름: 이후 자동 노출 안 함)
  seenToday:false,   // 오늘 자동 노출을 이미 보여줌
  modal:false, trigger:'banner', notes:true, showhs:false, preset:'p1', logs:[], toast:null,
};
const PRESETS = [
  {v:'p1', t:'E01 배너 탭 → 안내 모달', d:'배너를 누르면 언제든 안내 모달이 열립니다.', set:{}, open:'banner'},
  {v:'p2', t:'E02 10/27~ 접속만 해도 자동 노출', d:'행사 3일 전(10/27)부터는 배너를 누르지 않아도 앱에 접속하면 모달이 저절로 뜹니다. 하루 1번. 날짜는 서버 설정값(popup_auto_start_at)으로 미리 넣어둠.', set:{seenToday:false}, open:'auto'},
  {v:'p3', t:'E03 닫기 → 다음 날 다시 뜸', d:'"닫기" · 바깥 탭 · 뒤로가기로 닫으면 그날은 끝, 다음 날 첫 진입 때 다시 자동 노출. 닫기를 누른 뒤 "하루 지남" → "앱 다시 열기"를 눌러보세요.', set:{seenToday:false}, open:'auto'},
  {v:'p4', t:'E04 다시 보지 않기', d:'"다시 보지 않기"를 누르면 자동 노출이 영영 멈춥니다. 배너는 그대로라 누르면 모달이 열려요. 누른 뒤 "하루 지남" → "앱 다시 열기"로 확인해 보세요.', set:{seenToday:false}, open:'auto'},
  {v:'p5', t:'E05 10/16~10/26 (배너 탭해야 모달)', d:'자동 노출 시작 전. 앱에 접속해도 모달은 안 뜨고, 배너를 눌러야 열립니다.', set:{period:'banner'}},
  {v:'p8', t:'E08 10/27 전에 다시 보지 않기 누른 분', d:'10/26에 배너로 열어 "다시 보지 않기"를 눌렀어도, 10/27 자동 노출이 시작되면 1번은 다시 뜹니다 (모두가 보도록). 그 뒤에 다시 누르면 그때부터 안 뜸.', set:{period:'auto',never:'pre',seenToday:false}, open:'auto'},
  {v:'p6', t:'E06 10/30 17시 이후', d:'배너와 모달을 내립니다. 종료 화면은 없어요.', set:{period:'closed'}},
  {v:'p7', t:'E07 3기 아닌 계정', d:'배너 자리 자체가 없고 모달도 안 뜹니다.', set:{cohort:false}},
];
const L = {period:{banner:'10/16~26',auto:'10/27~30 17시',closed:'10/30 17시~'}};
const DY=-8;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now = () => new Date().toTimeString().slice(0,8);
function log(n,p){ S.logs.unshift({t:now(),n,p}); S.logs=S.logs.slice(0,30); }
function toast(m){ S.toast=m; render(); clearTimeout(window.__t); window.__t=setTimeout(()=>{S.toast=null;render()},2400); }
const bannerOn = () => S.cohort && S.period!=='closed';

function openModal(trigger){
  if (!bannerOn()) return;
  S.trigger=trigger; S.modal=true;
  if (trigger==='banner') log('event_banner_click',{event_id:EVENT_ID});
  log('event_modal_view',{event_id:EVENT_ID, trigger});
  render();
}
function appOpen(){
  S.modal=false;
  if (bannerOn() && S.period==='auto' && S.never!=='auto' && !S.seenToday){ S.seenToday=true; openModal('auto'); return; }
  toast(!S.cohort?'3기 아님: 배너 · 모달 없음' : S.period==='closed'?'10/30 17시 이후: 배너 · 모달 내림' : S.period==='banner'?'10/27 전: 접속해도 자동 노출 없음 (배너를 눌러야 열림)' : S.never==='auto'?'"다시 보지 않기" 누름: 자동 노출 없음' : '오늘 이미 봄: 자동 노출 없음');
}
function closeModal(how){
  log('event_modal_close',{event_id:EVENT_ID, trigger:S.trigger, how});
  if (how==='never'){ S.never = S.period==='auto' ? 'auto' : 'pre'; log('event_modal_never',{event_id:EVENT_ID, phase:S.never}); }
  S.modal=false; render();
  if (how==='never') toast(S.never==='auto'?'다시 보지 않기: 앞으로 자동으로 뜨지 않아요':'10/27 전이라 기록만 함: 자동 노출 시작 때 1번은 다시 뜸');
}
function applyPreset(v){
  const p=PRESETS.find(x=>x.v===v); if(!p) return;
  Object.assign(S,{period:'auto',cohort:true,never:false,seenToday:true,modal:false,logs:[],trigger:'banner'},p.set);
  S.preset=v;
  if (p.open==='auto') return appOpen();
  if (p.open==='banner') return openModal('banner');
  render();
}
function setSim(k,v){ S[k]=v; S.preset=''; if(!bannerOn()) S.modal=false; render(); }

function hs(x,y,w,h,label,onclick){ return `<button class="hs" style="left:${x}px;top:${y+DY}px;width:${w}px;height:${h}px" aria-label="${label}" onclick="${onclick}"></button>`; }
function phoneHTML(){
  const home = bannerOn()
    ? `<div class="home"><img src="img/home.png" width="393" height="1584" alt="두뇌운동 치매예방교실 홈" draggable="false">${hs(16,329-DY,361,180,'3기 수료식 초대. 10월 30일 금요일 오후 1시부터 5시. 눌러서 자세히 보기',"openModal('banner')")}</div>`
    : `<div class="home"><img src="img/home-nobanner.png" width="393" height="1388" alt="두뇌운동 치매예방교실 홈 (배너 없음)" draggable="false"></div>`;
  const anim = S.modal && !S._open ? ' anim' : ''; S._open = S.modal;
  const modal = S.modal ? `<div class="dim" onclick="if(event.target===this)closeModal('dim')"><div role="dialog" aria-modal="true" aria-label="3기 수료식 안내">
      <div class="mimg${anim}" style="height:${785+DY}px"><img src="img/m-info.png" width="329" height="785" alt="2026 두뇌운동 치매예방교실. 3기 수료식에 초대합니다. 의견을 들려주시면 건강기능식품을 드려요. 일시 10월 30일(금) 오후 1~5시, 장소 남동구 보건소 4층 대강당, 준비물 휴대폰. 4기 미리 신청 혜택: 선물 하나 더 드려요. 자세한 문의 032-453-6160." draggable="false">
      <a class="hs" href="tel:0324536160" aria-label="자세한 문의 전화 032-453-6160" style="left:24px;top:${591+DY}px;width:281px;height:52px" onclick="log('event_modal_tel',{event_id:EVENT_ID});"></a>${hs(24,663,281,60,'닫기',"closeModal('close')")}${hs(24,725,281,48,'다시 보지 않기',"closeModal('never')")}</div></div></div>` : '';
  return `<div class="scroll" id="scr" ${S.modal?'aria-hidden="true"':''}>${home}</div>${modal}${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}`;
}
function panelHTML(){
  const p=PRESETS.find(x=>x.v===S.preset);
  return `<h1>검수 패널</h1>
    <p class="lead">3기 수료식 초대 · 안내형 v3.0 (최종). 배너 + 안내 모달만. 신청 · 저장 · 문자 없음. 화면은 Figma 그대로(PNG).</p>
    <div class="sec"><div class="lab">설명</div>
      <button class="pbtn ${S.notes?'on':''}" onclick="S.notes=!S.notes;render()">${S.notes?'화면 설명 닫기':'화면 설명 열기'}</button>
      <button class="pbtn ${S.showhs?'on':''}" onclick="S.showhs=!S.showhs;render()">${S.showhs?'탭 영역 숨기기':'탭 영역 보기'}</button>
      <a class="link" href="spec.html">명세서 보기 →</a></div>
    <div class="sec"><div class="lab gold">버전</div>
      <div style="background:#1D2228;border:1px solid #4B6E96;border-radius:8px;padding:8px 10px"><b style="display:block;font-size:12.5px;color:#fff">v3.0 안내형 (최종)</b><span style="font-size:11px;color:#8B949E">2026-10-08 · 화면 2개 · 10/27 자동 노출</span></div></div>
    <div class="sec"><div class="lab">화면</div>
      <div class="chips"><button class="pbtn ${!S.modal?'on':''}" onclick="S.modal=false;S.preset='';render()">① 홈 배너</button><button class="pbtn ${S.modal?'on':''}" onclick="S.preset='';S.cohort=true;if(S.period==='closed')S.period='auto';openModal('banner')">② 안내 모달</button></div></div>
    <div class="sec"><div class="lab">예외 상태</div>
      <select onchange="applyPreset(this.value)"><option value="" ${!S.preset?'selected':''}>직접 조작 중</option>${PRESETS.map(o=>`<option value="${o.v}" ${S.preset===o.v?'selected':''}>${o.t}</option>`).join('')}</select>
      <p class="pdesc">${p?p.d:'아래 조건을 바꾸거나 화면을 눌러 흐름을 따라가세요.'}</p></div>
    <div class="sec"><div class="lab">조건</div>
      <div class="row-l">기간</div><div class="seg">${Object.entries(L.period).map(([v,l])=>`<button class="pbtn ${S.period===v?'on':''}" onclick="setSim('period','${v}')">${l}</button>`).join('')}</div>
      <div class="row-l">계정</div><div class="seg"><button class="pbtn ${S.cohort?'on':''}" onclick="setSim('cohort',true)">3기</button><button class="pbtn ${!S.cohort?'on':''}" onclick="setSim('cohort',false)">3기 아님</button></div>
      <div class="row-l">다시 보지 않기</div><div class="seg"><button class="pbtn ${!S.never?'on':''}" onclick="setSim('never',false)">안 누름</button><button class="pbtn ${S.never==='pre'?'on':''}" onclick="setSim('never','pre')">10/27 전 누름</button><button class="pbtn ${S.never==='auto'?'on':''}" onclick="setSim('never','auto')">10/27~ 누름</button></div>
      <button class="pbtn" style="width:100%;margin-top:6px" onclick="appOpen()">앱 다시 열기 (자동 노출 판단)</button>
      <button class="pbtn" style="width:100%;margin-top:6px" onclick="S.seenToday=false;S.preset='';toast('하루 지남: 오늘 자동 노출 기록 초기화')">하루 지남</button></div>
    <div class="sec"><div class="lab">로그 (최근 순)</div>
      <div class="log">${S.logs.length?S.logs.map(l=>`<div><span class="t">${l.t}</span> <span class="e">${l.n}</span><br>${esc(JSON.stringify(l.p))}</div>`).join(''):'<span class="t">아직 없음</span>'}</div></div>
    <div class="rules">본문 17px 이상 · 주 버튼 60px · 자간 0.<br>모달은 한 번에 하나.</div>`;
}
function card(id,title,lines,warn){return `<div class="nc ${warn?'warn':''}"><div class="h"><span class="id">${id}</span><b>${title}</b></div>${lines.map(([k,v])=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('')}</div>`}
function notesHTML(){
  const out=[];
  out.push(card('NOW','지금 상태',[['조건',`${L.period[S.period]} · ${S.cohort?'3기':'3기 아님'} · 다시 보지 않기 ${S.never==='auto'?'누름(10/27~)':S.never==='pre'?'누름(10/27 전, 무시)':'안 누름'}`],['화면',S.modal?`② 안내 모달 (${S.trigger==='auto'?'자동 노출':'배너 탭'})`:(bannerOn()?'① 홈 배너':'홈 · 배너 없음')],['Figma',S.modal?'2041:1407 (v3.0 섹션)':'2041:1444 (v3.0 섹션)']]));
  if (!S.modal) out.push(card('①','홈 배너',[
    ['노출','3기 계정, 10/16(금) ~ 10/30(금) 17시. 이후엔 배너 자리를 빼고 아래 카드가 위로 붙음'],
    ['문구','10월 30일(금) 오후 1~5시 / 3기 수료식에 초대합니다 / 건강기능식품 받으러 가기 ›'],
    ['탭','언제든 ② 안내 모달. 10/26까지는 배너를 눌러야만 모달을 볼 수 있음'],
    ['로그','event_banner_click']]));
  else out.push(card('②','안내 모달',[
    ['문구','2026 두뇌운동 치매예방교실 / 3기 수료식에 초대합니다 / 의견을 들려주시면 건강기능식품을 드려요 + 일시 · 장소 · 준비물 + 4기 미리 신청 혜택'],
    ['문의','"자세한 문의 032-453-6160" 줄. 누르면 전화 걸기 (보건소)'],
    ['닫기','주 버튼. 바깥 탭 · 뒤로가기도 같음. 10/27부터는 다음 날 접속 때 다시 자동으로 뜸'],
    ['다시 보지 않기','보조 버튼. 10/27부터 누르면 이후 자동 노출 안 함. 10/27 전에 누른 건 무시(자동 노출 첫날 1번은 뜸). 폰에 기록'],
    ['로그','event_modal_view(trigger) · event_modal_close(how) · event_modal_never · event_modal_tel']]));
  out.push(card('⚠','개발팀 요청: 노출 설정값 미리 넣기',[
    ['요청','지금은 배너를 눌러야 모달을 보지만, 행사 3일 전(10/27)부터는 접속만 해도 모달이 자동으로 떠서 모두가 보도록. 날짜가 되면 저절로 바뀌게 설정값으로 미리 넣고, 앱 배포 없이 바꿀 수 있게 서버(원격) 설정으로'],
    ['banner','banner_start_at = 2026-10-16 00:00 KST'],
    ['auto','popup_auto_start_at = 2026-10-27 00:00 KST'],
    ['빈도','popup_auto_frequency = 하루 1번 (그날 첫 앱 진입)'],
    ['종료','end_at = 2026-10-30 17:00 KST: 배너 · 모달 내림']],true));
  out.push(card('AUTO','자동 노출 규칙',[
    ['기간','10/27(화) ~ 10/30(금) 17시'],
    ['빈도','하루 첫 앱 진입 때 1번'],
    ['안 뜸','10/27부터 "다시 보지 않기" 누른 분 · 3기 아님 · 기간 밖'],
    ['기준','날짜 · 시각은 서버 시간(KST). "다시 보지 않기"는 앱 재설치 · 기기 변경 시 초기화(허용)']]));
  out.push(card('OFF','이번에 하지 않는 것',[
    ['신청','방문 신청 · 취소, 서버 저장 없음'],
    ['문자','앱 자동 문자 없음. 행사 문자는 보건소 단체 문자 4회'],
    ['화면','완료 · 취소 · 저장 중 · 실패 화면 없음 (Figma 보관 섹션)']]));
  return `<div class="hd"><div><b>화면 설명</b><p>보고 있는 화면 · 상태에 맞춰 바뀝니다.</p></div><button class="x" onclick="S.notes=false;render()" aria-label="설명 닫기">✕</button></div>${out.join('')}`;
}
function render(){
  if (!S.modal) S._open=false;
  document.getElementById('panel').innerHTML=panelHTML();
  const sc=document.getElementById('scr'), top=sc?sc.scrollTop:0;
  const ph=document.getElementById('phone'); ph.innerHTML=phoneHTML(); ph.classList.toggle('showhs',S.showhs);
  const sc2=document.getElementById('scr'); if(sc2) sc2.scrollTop=top;
  const n=document.getElementById('notes'); n.style.display=S.notes?'':'none'; if(S.notes) n.innerHTML=notesHTML();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.modal) closeModal('back'); });
render();
</script>
</body>
</html>
