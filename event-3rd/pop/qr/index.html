<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>맬리브레인 4기 신청 QR 안내</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;background:#888}
.pg{width:794px;height:1123px;position:relative;overflow:hidden;padding:110px 80px 0;page-break-after:always;margin:0 auto 20px}
@media print{body{background:none}.pg{margin:0}}
.dark{background:#265F4D;color:#fff} .cream{background:#FFF7EF;color:#1B1B1B} .yel{background:#FFD54A;color:#1B1B1B}
.circ{position:absolute;border-radius:50%;background:#2F6E59}
.st{position:absolute}
.pill{position:relative;z-index:1;display:inline-block;border:3px solid #fff;border-radius:40px;padding:8px 26px;font-size:26px;font-weight:700}
.pill.dk{border-color:#265F4D;color:#265F4D}
.tag{display:inline-block;background:#265F4D;color:#fff;border-radius:12px;padding:8px 22px;font-size:28px;font-weight:700}
.hx{position:relative;font-size:92px;font-weight:900;line-height:1.18;letter-spacing:-3px}
.g{color:#265F4D} .g2{color:#265F4D}
.sub{position:relative;font-size:34px;font-weight:500;margin-top:30px;line-height:1.5;letter-spacing:-.5px}
.box{position:absolute;left:80px;right:80px;background:#FFD54A;color:#265F4D;border-radius:24px;padding:30px;text-align:center;font-size:42px;font-weight:900;letter-spacing:-1px}
.foot{position:absolute;left:0;right:0;bottom:36px;text-align:center;font-size:20px;font-weight:700;opacity:.75}
.drink{position:relative;display:flex;align-items:center;gap:28px;margin-top:70px;background:#fff;border-radius:28px;padding:34px 36px;box-shadow:0 6px 20px rgba(0,0,0,.06);width:520px}
.drink b{font-size:40px;font-weight:900;color:#265F4D} .drink span{font-size:26px;color:#555}
.cup{width:76px;height:92px;background:#FFD54A;border-radius:6px 6px 22px 22px;position:relative;flex:none}
.cup:after{content:"";position:absolute;right:-24px;top:20px;width:26px;height:40px;border:8px solid #FFD54A;border-left:none;border-radius:0 18px 18px 0}
.num{width:320px;height:320px;margin:0 auto;border-radius:50%;background:#265F4D;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 18px #FFD54A}
.num span{font-size:220px;font-weight:900;color:#fff;line-height:1}
.steps{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:56px}
.stp{width:196px;background:#fff;border-radius:22px;padding:24px 10px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.stp i{display:inline-flex;width:44px;height:44px;border-radius:50%;background:#265F4D;color:#fff;font-style:normal;font-weight:900;font-size:24px;align-items:center;justify-content:center}
.stp b{display:block;font-size:36px;font-weight:900;color:#265F4D;margin-top:10px;letter-spacing:-1px}
.stp span{display:block;font-size:23px;color:#666;margin-top:4px}
.stp.gift{background:#FFD54A}
.arr{font-size:54px;color:#265F4D;font-weight:700}
.ticket{display:flex;align-items:center;gap:20px;margin:50px auto 0;width:640px;background:#265F4D;color:#fff;border-radius:18px;padding:24px 30px;font-size:32px;font-weight:700}
.ticket .tl{color:#FFD54A;font-weight:900;font-size:22px;border-right:3px dashed #FFD54A;padding-right:18px}
.ticket b{color:#FFD54A}
.cp{display:flex;margin-top:46px;width:620px;height:150px;transform:rotate(-2deg)}
.cp2{margin-left:20px;transform:rotate(2deg);margin-top:26px}
.cpl{width:150px;background:#265F4D;color:#FFD54A;border-radius:20px 0 0 20px;border-right:4px dashed #FFD54A;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.cpl b{font-size:54px;color:#fff;font-weight:900;line-height:1}
.cpr{flex:1;background:#265F4D;border-radius:0 20px 20px 0;color:#fff;display:flex;flex-direction:column;justify-content:center;padding-left:30px}
.cpr span{font-size:24px;color:#CFE6DB} .cpr b{font-size:46px;font-weight:900;letter-spacing:-1px}
.cp2 .cpl,.cp2 .cpr{background:#fff;color:#265F4D} .cp2 .cpl{color:#265F4D;border-right-color:#265F4D} .cp2 .cpl b{color:#265F4D} .cp2 .cpr span{color:#555}
.phone{width:170px;height:290px;margin:40px auto 0;border-radius:30px;background:#265F4D;padding:14px;position:relative}
.scr{width:100%;height:100%;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center}
.dot{width:80px;height:80px;border-radius:50%;background:#FFD54A}
.okbox{margin:40px auto 0;width:560px;background:#fff;border:4px solid #265F4D;border-radius:24px;padding:26px;text-align:center;font-size:38px;font-weight:900;color:#265F4D;letter-spacing:-1px}
.okbox span{display:block;font-size:26px;font-weight:500;color:#555;margin-top:6px;letter-spacing:0}
.qrbox{width:350px;margin:22px auto 0;background:#fff;border:12px solid #265F4D;border-radius:28px;padding:18px 18px 12px}
.qrbox img{width:100%;display:block;image-rendering:pixelated}
.qrl{font-size:28px;font-weight:900;color:#265F4D;margin-top:4px}
.qs{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:26px}
.qs>div:not(.a){width:190px;background:#fff;border-radius:20px;padding:16px 8px;font-size:26px;font-weight:800;color:#265F4D;line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.qs i{display:flex;margin:0 auto 6px;width:40px;height:40px;border-radius:50%;background:#FFD54A;color:#265F4D;font-style:normal;font-weight:900;font-size:22px;align-items:center;justify-content:center;margin-bottom:6px}
.qs .a{font-size:46px;color:#265F4D;font-weight:700}
*{word-break:keep-all;overflow-wrap:break-word}</style></head><body><section class="pg cream" style="text-align:center;padding-top:60px">

<div class="tag">4기 신청 · 앱 설치</div>

<div class="qrbox"><img src="../img/qr4.png"><div class="qrl">맬리브레인 4기 신청</div></div>
<div class="qs">

</div>

<div class="foot g">남동구 보건소 · 맬리브레인</div></section></body></html>
