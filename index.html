<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맬리브레인 3기 종료 리포트 — 검수용</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  background:#20262E;color:#191F28;display:flex;min-height:100vh}

/* ── 검수 패널 ───────────────────────────── */
#panel{width:300px;flex-shrink:0;background:#171C22;color:#D1D6DB;padding:18px 16px 60px;
  height:100vh;overflow-y:auto;position:sticky;top:0;font-size:13px}
#panel h1{font-size:15px;font-weight:800;color:#fff;margin-bottom:4px}
#panel .sub{font-size:11px;color:#8B949E;line-height:1.6;margin-bottom:16px}
.grp{margin-bottom:14px;border-top:1px solid #2A313A;padding-top:12px}
.grp:first-of-type{border-top:0}
.grp label{display:block;font-size:11px;font-weight:700;color:#6EE7B7;letter-spacing:.04em;margin-bottom:6px}
.grp select{width:100%;background:#242B33;color:#E6EAF0;border:1px solid #333C46;border-radius:6px;
  padding:7px 8px;font-size:12px;font-family:inherit}
.grp .desc{font-size:11px;color:#8B949E;line-height:1.55;margin-top:6px;white-space:pre-line}
.btnrow{display:flex;gap:6px;margin-bottom:14px}
.btnrow button{flex:1;background:#2A313A;color:#E6EAF0;border:1px solid #3A434E;border-radius:6px;
  padding:8px;font-size:12px;font-family:inherit;cursor:pointer}
.btnrow button:hover{background:#333C46}
.jump{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.jump a{background:#242B33;color:#9AA3AD;border:1px solid #333C46;border-radius:5px;
  padding:4px 7px;font-size:11px;text-decoration:none}
.jump a:hover{color:#6EE7B7;border-color:#0E7A52}

/* ── 화면 영역 ───────────────────────────── */
#stage{flex:1;display:flex;justify-content:center;padding:28px 20px 120px;overflow-x:hidden}
#phone{width:375px;position:relative;background:linear-gradient(180deg,#E4F2EA 0%,#E9F1F5 55%,#EDEAF6 100%);
  border-radius:0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
section{width:375px;min-height:812px;padding:64px 20px 0;position:relative;display:flex;flex-direction:column}
section[hidden]{display:none}
.secmark{position:absolute;left:8px;top:8px;background:#0E7A52;color:#fff;font-size:10px;
  font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.04em;z-index:5}

/* 공통 요소 */
.pill{display:inline-flex;align-self:flex-start;background:rgba(16,84,62,.10);color:#0A6B47;
  font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px}
.pill.c{align-self:center}
h2.head{font-size:29px;font-weight:800;letter-spacing:-.035em;line-height:1.32;margin-top:10px;text-wrap:balance}
.center{text-align:center}
.tile{background:rgba(255,255,255,.62);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.86);
  box-shadow:0 3px 18px rgba(18,64,48,.055);border-radius:20px;padding:20px 16px}
.card{background:rgba(255,255,255,.70);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.92);
  box-shadow:0 6px 28px rgba(18,64,48,.07);border-radius:22px;padding:20px}
.dark{background:linear-gradient(152deg,#1D3A31 0%,#0F241E 100%);box-shadow:0 10px 34px rgba(12,42,32,.24);
  border-radius:22px;padding:22px 20px;color:#fff}
.lbl{font-size:15px;font-weight:600;color:#4E5968;margin-bottom:8px}
.val{font-size:33px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.val .u{font-size:15px;font-weight:600;color:#4E5968;margin-left:3px}
.sub2{font-size:15px;color:#5C6675;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.hint{margin-top:auto;padding:28px 0 34px;text-align:center}
.hint p{font-size:15px;font-weight:600;color:#55636E}
.hint .circ{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 3px 18px rgba(18,64,48,.10);
  display:flex;align-items:center;justify-content:center;margin:10px auto 0;color:#0A6B47;font-weight:900}
.closeBtn{position:sticky;top:34px;align-self:flex-end;margin-right:-4px;width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;z-index:40;
  background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border-radius:50%;
  box-shadow:0 2px 12px rgba(18,64,48,.10);font-size:18px;color:#4E5968;cursor:pointer}
.muted{color:#9AA3AD}

/* ── 모션 (M-01 ~ M-10) ───────────────────── */
.rv{opacity:0;transform:translateY(22px)}
section.on .rv{opacity:1;transform:none;
  transition:opacity .45s ease var(--d,0ms), transform .55s cubic-bezier(.23,1,.32,1) var(--d,0ms)}
.hint .circ{animation:bounce 1.8s ease-in-out infinite}                 /* M-01 */
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.hero{animation:float 4.4s ease-in-out infinite}                        /* M-02 */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.glow{animation:glow 3.6s ease-in-out infinite}                         /* M-03 */
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.draw{stroke-dasharray:340px;stroke-dashoffset:340px}                   /* M-05 */
section.on .draw{stroke-dashoffset:0;transition:stroke-dashoffset 1s cubic-bezier(.23,1,.32,1) .3s}
.dot{opacity:0}
section.on .dot{opacity:1;transition:opacity .35s ease 1.1s}
.needle{transform-origin:150px 150px;transform:rotate(30deg);opacity:0} /* M-06 */
section.on .needle{transform:rotate(0);opacity:1;
  transition:transform .9s cubic-bezier(.23,1,.32,1) .5s, opacity .3s ease .45s}
.ghost{opacity:0}
section.on .ghost{opacity:1;transition:opacity .5s ease .9s}
section:not(.on) .donut{stroke-dashoffset:251.3px}                      /* M-07 */
section.on .donut{stroke-dashoffset:var(--dOff);
  transition:stroke-dashoffset 1s cubic-bezier(.23,1,.32,1) .35s}
section:not(.on) .bar{width:0 !important}
section.on .bar{width:var(--w) !important;
  transition:width .7s cubic-bezier(.23,1,.32,1) var(--d,0ms)}
.bob{animation:bob 2.6s ease-in-out infinite}                           /* M-08 */
@keyframes bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
.certWrap{overflow:hidden}                                              /* M-09 프린팅 */
.certPaper{transform:translateY(-103%)}
section.on .certPaper{transform:none;
  transition:transform 1.15s cubic-bezier(.3,1,.4,1) .2s}
.conf{position:absolute;top:-30px;pointer-events:none;z-index:30}       /* M-10 */
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
button{transition:transform .12s ease}
button:active{transform:scale(.98)}
#sheetWrap{animation:slideUp .38s cubic-bezier(.23,1,.32,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
#dim{animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.motionOff .rv,.motionOff .draw,.motionOff .dot,.motionOff .needle,.motionOff .ghost,.motionOff .certPaper
  {opacity:1 !important;transform:none !important;stroke-dashoffset:0 !important}
.motionOff section .bar{width:var(--w) !important;transition:none !important}
.motionOff .donut{stroke-dashoffset:var(--dOff) !important;transition:none !important}
</style>
</head>
<body>

<div id="panel">
  <h1>맬리브레인 3기 종료 리포트</h1>
  <div class="sub">검수용 · 디스크립션 기준<br>왼쪽에서 예외를 바꾸면 오른쪽 화면이 즉시 반영됩니다.</div>

  <div class="btnrow">
    <button onclick="resetAll()">전부 정상으로</button>
    <button onclick="allNet()">네트워크 상태</button>
  </div>
  <div class="btnrow">
    <button onclick="replay()">▶ 모션 다시 보기</button>
    <button id="btnMotion" onclick="toggleMotion()">모션 끄기</button>
  </div>
  <div class="jump" id="jump"></div>
  <div id="controls"></div>
</div>

<div id="stage"><div id="phone"></div></div>

  return `<section id="s06"><span class="secmark">SC-RP-06</span>
    <div class="pill">한 걸음 더</div>
    <h2 class="head">얼마나 걸었을까요</h2>
    <div style="display:grid;grid-template-columns:180fr 140fr;gap:15px;margin-top:18px">
      <div class="tile" style="background:rgba(16,84,62,.075);backdrop-filter:none;border:0;box-shadow:none">
        <div class="lbl">총 걸음 수</div>
        <div style="font-size:26px;font-weight:800;letter-spacing:-.035em">${nf(총)}<span class="u">보</span></div></div>
      <div class="tile"><div class="lbl">걸은 날</div>
        <div style="font-size:26px;font-weight:800;letter-spacing:-.035em">${날}<span class="u">일</span></div></div>
    </div>
    <div class="dark" style="margin-top:12px;display:flex;align-items:center;gap:16px">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="40" stroke="rgba(255,255,255,.14)" stroke-width="10" fill="none"/>
        <circle cx="48" cy="48" r="40" stroke="#13BD7E" stroke-width="10" fill="none" stroke-linecap="round"
          stroke-dasharray="251.3" stroke-dashoffset="${251.3*(1-Math.min(1,달성/100))}" transform="rotate(-90 48 48)"/>
        <text x="48" y="53" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">${달성}%</text></svg>
      <div><div style="font-size:17px;color:rgba(255,255,255,.75)">하루 평균</div>
        <div style="font-size:26px;font-weight:800">${nf(평균)}<span style="font-size:15px;font-weight:600;margin-left:3px">보</span></div>
        <div style="font-size:14px;color:rgba(255,255,255,.55);margin-top:4px">하루 목표 10,000보 기준</div></div>
    </div>
    ${환산카드}
    ${hint()}</section>`;
}

/* ══════════ 07 수료증 ══════════ */
function sec07(){
  const v=S.s07;
  const br = ['B'].includes(v)?'B' : ['C','g'].includes(v)?'C' : 'A';
  const T={A:['수 료 증','수료를 축하드려요!','2026년 맬리브레인 3기\n치매예방 인지훈련 프로그램을\n성실히 수료하였음을 증명합니다.'],
           B:['참 여 기 록','이만큼 함께했어요!','2026년 맬리브레인 3기\n치매예방 인지훈련 프로그램에\n함께해 주셔서 고맙습니다.'],
           C:['참 여 확 인','4기에도 함께해요!','2026년 맬리브레인 3기에\n등록해 주셔서 고맙습니다.\n다음 기수에서는 꼭 함께해요!']};
  let [제목,헤딩,본문]=T[br];
  if(v==='g') 본문='2026년 맬리브레인 3기 치매예방 인지훈련 교실에\n등록해 주셔서 고맙습니다.\n다음 기수에서는 꼭 끝까지 함께해요!';
  const 이름 = v==='d' ? '회원님' : '김*리 님';
  const 일수 = v==='f' ? 242 : D.참여일, 율 = v==='f' ? 100 : D.참여율;
  const 통계 = br==='C';
  const 저장 = br!=='C';
  const 저장문구 = br==='B' ? '참여기록 저장하기' : '수료증 저장하기';
  const 전환문구 = v==='l' ? '4기 신청이 완료되었습니다' : '4기도 참여하기 →';
  const 전환비활 = v==='l';
  return `<section id="s07"><span class="secmark">SC-RP-07 · ${br}분기</span>
    <div class="pill c">맬리브레인 3기</div>
    <h2 class="head center">${헤딩}</h2>
    <div style="margin-top:18px">
      <div style="height:10px;border-radius:10px 10px 0 0;background:#C9CFD6;position:relative;z-index:2"></div>
      <div class="certWrap"><div class="certPaper" style="position:relative;aspect-ratio:1/1;background:#FBFBF7;
        border:8px solid transparent;border-image:linear-gradient(135deg,#A8842F,#E8D08A 28%,#F7EBC4 50%,#C8A44D 72%,#A8842F) 1;
        display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:30px 20px 26px;text-align:center">
        <div style="font-family:Georgia,serif;font-size:22px;font-weight:700;letter-spacing:.24em">${제목}</div>
        <div style="width:40px;height:2px;background:#13BD7E;margin:14px 0"></div>
        <div style="font-family:Georgia,serif;font-size:20px;font-weight:700;margin-bottom:10px">${이름}</div>
        <div style="font-size:14px;color:#4E5968;line-height:1.4;white-space:pre-line">${본문}</div>
        ${통계?'':`<div style="display:flex;align-items:center;gap:14px;margin-top:auto;font-size:12px;color:#5C6675">
          <span>함께한 날 <b style="font-size:14px;font-weight:800;color:#191F28">${일수}일</b>
            <span style="font-size:13px;color:#9AA3AD">/${D.분모}일</span></span>
          <span style="width:1px;height:11px;background:#E5E8EB"></span>
          <span>참여율 <b style="font-size:14px;font-weight:800;color:#191F28">${율}%</b></span></div>`}
        <div style="position:relative;margin-top:${통계?'auto':'18px'}">
          <div style="font-size:10px;color:#55636E;line-height:1.7">인천광역시 남동구 치매안심센터<br>발급일 2026년 11월 1일</div>
          <div style="position:absolute;right:-37px;top:-24px;width:48px;height:48px;border-radius:50%;
            border:2px solid rgba(194,65,12,.6);color:rgba(194,65,12,.75);font-size:10px;font-weight:900;
            display:flex;align-items:center;justify-content:center;line-height:1.15;transform:rotate(-8deg);
            mix-blend-mode:multiply">맬 리<br>브레인</div>
        </div>
      </div></div>
    </div>
    ${v==='e'?`<div class="card" style="margin-top:12px;background:rgba(194,65,12,.06)">
      <div style="font-size:14px;font-weight:700;color:#C2410C">저장하지 못했습니다</div>
      <div style="font-size:13px;color:#4E5968;margin-top:4px">잠시 후 다시 시도해 주세요. (P15)</div></div>`:''}
    <div style="margin-top:26px;display:flex;flex-direction:column;gap:10px">
      ${저장?`<button style="padding:16px;border-radius:14px;border:1.5px solid #0E7A52;background:#fff;
        color:#0A6B47;font-size:17px;font-weight:700;font-family:inherit">${저장문구}</button>`:''}
      <button onclick="${전환비활?'':'openSheet()'}" style="padding:17px;border-radius:14px;border:0;
        background:${전환비활?'#E5E8EB':'#0E7A52'};color:${전환비활?'#9AA3AD':'#fff'};
        font-size:17px;font-weight:700;font-family:inherit;cursor:${전환비활?'default':'pointer'}">${전환문구}</button>
      <button style="padding:17px;border-radius:14px;border:0;background:rgba(16,84,62,.08);
        color:#4E5968;font-size:17px;font-weight:700;font-family:inherit">홈으로 돌아가기</button>
    </div>
    <div style="height:40px"></div></section>`;
}

/* ══════════ 08 4기 신청 ══════════ */
function sec08(){
  if(S.s08==='-') return '';
  const fail = S.s08==='a';
  return `<section id="s08" style="justify-content:flex-start"><span class="secmark">${fail?'08-a':'SC-RP-08'}</span>
    <div class="pill c">${fail?'4기 신청':'맬리브레인 4기'}</div>
    <h2 class="head center" style="font-size:26px">${fail?'신청하지 못했습니다.':'신청이 완료되었습니다.'}</h2>
    <div class="card" style="margin-top:34px;text-align:center;padding:36px 24px">
      <div style="width:64px;height:64px;border-radius:50%;margin:0 auto 18px;
        background:${fail?'rgba(194,65,12,.10)':'rgba(14,122,82,.10)'};
        display:flex;align-items:center;justify-content:center;font-size:28px;
        color:${fail?'#C2410C':'#0E7A52'};font-weight:900">${fail?'!':'✓'}</div>
      <div style="font-size:17px;font-weight:800;line-height:1.4">2027년 인천 남동구 보건소<br>치매예방 프로그램 4기</div>
      <div style="font-size:14px;color:#4E5968;line-height:1.4;margin-top:18px">
        ${fail?'잠시 후 다시 시도해 주세요.<br>문제가 계속되면 {전화번호}로 문의 바랍니다.'
              :'자세한 문의사항은 {전화번호}로 문의 바랍니다.<br>감사합니다.'}</div>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:40px">
      ${fail?`<button style="padding:17px;border-radius:14px;border:0;background:#0E7A52;color:#fff;
        font-size:17px;font-weight:700;font-family:inherit">다시 시도</button>`:''}
      <button style="padding:17px;border-radius:14px;border:0;background:rgba(16,84,62,.08);
        color:#4E5968;font-size:17px;font-weight:700;font-family:inherit">홈으로 돌아가기</button>
    </div></section>`;
}

/* ══════════ 공통 ══════════ */
function hint(){ return `<div class="hint"><p>화면을 아래로 더 내려보세요</p><div class="circ">∨</div></div>`; }

function phoneX(){ const r=document.getElementById('phone').getBoundingClientRect(); return Math.round(r.left); }
function overlay(){
  const L=phoneX();
  if(S.net==='offline') return `<div style="position:fixed;top:0;bottom:0;left:${L}px;width:375px;
    background:rgba(15,36,30,.92);color:#fff;display:flex;flex-direction:column;align-items:center;
    justify-content:center;z-index:200;text-align:center;padding:40px">
    <div style="font-size:20px;font-weight:800">연결이 끊겼어요</div>
    <div style="font-size:14px;color:rgba(255,255,255,.7);margin-top:10px;line-height:1.6">
      네트워크 상태를 확인하고<br>다시 시도해 주세요. <span style="color:#6EE7B7">(P18)</span></div>
    <button onclick="S.net='ok';render()" style="margin-top:22px;padding:14px 28px;border-radius:12px;border:0;
      background:#13BD7E;color:#0F241E;font-weight:800;font-size:15px;font-family:inherit;cursor:pointer">다시 시도</button></div>`;
  if(S.net==='loading') return `<div style="position:fixed;top:0;bottom:0;left:${L}px;width:375px;
    background:rgba(232,243,236,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200">
    <div style="width:46px;height:46px;border-radius:50%;border:4px solid rgba(14,122,82,.18);
      border-top-color:#0E7A52;animation:spin .9s linear infinite"></div>
    <div style="font-size:15px;color:#4E5968;margin-top:16px">리포트를 불러오는 중이에요 <span style="color:#0A6B47">(P19)</span></div></div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
  return '';
}
function sheet(){
  if(!window.__sheet) return '';
  const L=phoneX();
  return `<div id="dim" style="position:fixed;top:0;bottom:0;left:${L}px;width:375px;
    background:rgba(15,36,30,.55);z-index:150" onclick="closeSheet()"></div>
  <div id="sheetWrap" style="position:fixed;left:${L}px;bottom:0;width:375px;background:#fff;
    border-radius:24px 24px 0 0;padding:14px 20px 34px;z-index:151;box-shadow:0 -12px 32px rgba(0,0,0,.18)">
    <div style="width:44px;height:4px;border-radius:2px;background:#D1D6DB;margin:0 auto 18px"></div>
    <div style="font-size:16px;text-align:center;line-height:1.45;color:#191F28">
      2027년 인천 남동구 보건소 치매예방 프로그램을<br>신청하시겠습니까?</div>
    <div style="display:flex;gap:10px;margin-top:22px">
      <button onclick="closeSheet()" style="flex:1;padding:15px;border-radius:14px;border:1.5px solid #0E7A52;
        background:#fff;color:#0A6B47;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer">닫기</button>
      <button onclick="applyDone()" style="flex:1;padding:15px;border-radius:14px;border:0;background:#0E7A52;
        color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer">네, 신청합니다</button></div>
  </div>`;
}
/* 시트 노출은 오직 S.s07==='h' 하나로만 결정 (상태 이원화 금지) */
function openSheet(){ S.s07='h'; render(); }
function closeSheet(){ if(S.s07==='h') S.s07='A'; render(); }
function applyDone(){ S.s07='l'; S.s08='0'; render();
  setTimeout(()=>document.getElementById('s08')?.scrollIntoView({behavior:'smooth'}),60); }
addEventListener('resize', ()=>{ if(window.__sheet || S.net!=='ok') render(); });

/* ══════════ 렌더 ══════════ */
function render(){
  document.getElementById('phone').innerHTML =
    sec01()+sec02()+sec03()+sec04()+sec04b()+sec05()+sec06()+sec07()+sec08()+overlay()+sheet();
  buildJump();
  for(const k in VARIANTS){ const el=document.getElementById('sel_'+k); if(el) el.value=S[k]; }
  const d=document.getElementById('d_s06');
  if(d) d.textContent = S.s06==='x' ? 'P16 · 걸음 미연동 27명(3.3%)은 이 섹션이 통째로 빠져 리포트가 7개 섹션이 됩니다.' : '';
}
function buildJump(){
  const ids=[['s01','01'],['s02','02'],['s03','03'],['s04','04'],['s04b','04B'],['s05','05'],['s06','06'],['s07','07'],['s08','08']];
  document.getElementById('jump').innerHTML = ids
    .filter(([id])=>document.getElementById(id))
    .map(([id,l])=>`<a href="#${id}" onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth'});return false">${l}</a>`).join('');
}
function buildControls(){
  document.getElementById('controls').innerHTML = Object.entries(VARIANTS).map(([k,v])=>`
    <div class="grp"><label>${v.label}</label>
      <select id="sel_${k}" onchange="S['${k}']=this.value;render()">
        ${v.opts.map(([val,txt])=>`<option value="${val}">${txt}</option>`).join('')}</select>
      <div class="desc" id="d_${k}"></div></div>`).join('');
}
function resetAll(){ Object.assign(S,{s01:'0',s02:'0',s03:'0',s04:'0',s04b:'0',s05:'0',s06:'0',s07:'A',s08:'-',net:'ok'});
  render(); }
function allNet(){ S.net = S.net==='ok' ? 'loading' : S.net==='loading' ? 'offline' : 'ok'; render(); }

/* ══════════════════════════════════════════
   모션 — 렌더 후 마크업에 애니메이션 클래스를 입힌다
   ══════════════════════════════════════════ */
let MOTION = true;
function decorate(){
  const root=document.getElementById('phone');
  root.classList.toggle('motionOff', !MOTION);

  root.querySelectorAll('section').forEach(sec=>{
    /* 진입 순차 등장 */
    [...sec.children].forEach((el,i)=>{
      if(el.classList.contains('secmark')||el.classList.contains('closeBtn')) return;
      el.classList.add('rv'); el.style.setProperty('--d',(i*70)+'ms');
    });
    /* 히어로 (M-02 · M-03) */
    const glow=sec.querySelector('[aria-hidden="true"]');
    if(glow&&sec.id==='s01'){ glow.classList.add('glow'); glow.firstElementChild?.classList.add('hero'); }
    /* 꺾은선 (M-05) */
    sec.querySelectorAll('polyline[stroke="#13BD7E"]').forEach(p=>p.classList.add('draw'));
    sec.querySelectorAll('svg circle[fill="#13BD7E"]').forEach(c=>c.classList.add('dot'));
    /* 게이지 바늘 · 고스트 (M-06) */
    sec.querySelectorAll('svg line').forEach(l=>
      l.classList.add(l.getAttribute('stroke-dasharray')?'ghost':'needle'));
    /* 도넛 (M-07) — CSS 변수로 목표 오프셋 전달 */
    const dn=sec.querySelector('circle[stroke-dasharray="251.3"]');
    if(dn){ dn.classList.add('donut');
      dn.style.setProperty('--dOff', dn.getAttribute('stroke-dashoffset')+'px'); }
    /* 막대 · 진행바 — --w만 심고 채움은 section.on CSS가 담당 */
    [...sec.querySelectorAll('div[style*="width:"]')].forEach((b,i)=>{
      if(b.classList.contains('conf')) return;
      const m=/width:\s*([\d.]+%)/.exec(b.getAttribute('style')||''); if(!m) return;
      b.style.setProperty('--w',m[1]); b.style.setProperty('--d',(i*90)+'ms'); b.classList.add('bar');
    });
    /* 내 순위 행 부유 (M-08) */
    if(sec.id==='s04b') sec.querySelector('div[style*="background:#0F241E"]')?.classList.add('bob');
  });
  observe();
}
function confetti(sec){
  const cols=['#13BD7E','#F7EBC4','#C8A44D','#6EE7B7','#0E7A52'];
  const wrap=document.createElement('div');
  wrap.style.cssText='position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:30';
  for(let i=0;i<26;i++){ const d=document.createElement('div');
    const w=4+(i%3)*3;
    d.className='conf';
    d.style.cssText=`left:${(i*97)%100}%;width:${w}px;height:${i%3===0?w:w*2}px;
      border-radius:${i%3===0?'50%':'2px'};background:${cols[i%cols.length]};opacity:.9;
      animation:fall ${(2.4+(i%5)*.45).toFixed(2)}s cubic-bezier(.3,.5,.6,1) ${((i%9)*.13).toFixed(2)}s forwards`;
    wrap.appendChild(d); }
  sec.appendChild(wrap);
}
/* 섹션이 화면에 들어오는 순간 : 등장 + 카운트업 + (07이면) 폭죽 */
function activate(sec){
  if(sec.classList.contains('on')) return;
  sec.classList.add('on');
  if(!MOTION || sec.dataset.act) return;
  sec.dataset.act='1';
  countUpIn(sec);
  if(sec.id==='s07' && !/C분기/.test(sec.querySelector('.secmark')?.textContent||''))
    setTimeout(()=>confetti(sec), 600);   /* 증서 프린팅이 반쯤 나왔을 때 터짐 */
}
let IO=null;
function observe(){
  IO?.disconnect();
  IO=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ activate(e.target); IO.unobserve(e.target); } }),{threshold:.12});
  document.querySelectorAll('#phone section').forEach(s=>{
    if(!MOTION){ s.classList.add('on'); return; }
    const r=s.getBoundingClientRect();
    if(r.top < innerHeight*0.9 && r.bottom > 0) activate(s); else IO.observe(s);
  });
}
function countUpIn(sec){
  sec.querySelectorAll('.val, .dark div[style*="font-size:26px"]').forEach(el=>{
    const m=/^([\d,]+)/.exec(el.textContent.trim()); if(!m) return;
    const end=+m[1].replace(/,/g,''); if(!end||end>2000000) return;
    const rest=el.innerHTML.slice(el.innerHTML.indexOf(m[1])+m[1].length);
    const pre=el.innerHTML.slice(0,el.innerHTML.indexOf(m[1]));
    const t0=performance.now(), dur=900;
    const step=(t)=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      el.innerHTML=pre+Math.round(end*e).toLocaleString('ko-KR')+rest;
      if(k<1) requestAnimationFrame(step); };
    el.innerHTML=pre+'0'+rest; requestAnimationFrame(step);
  });
}
const _render=render;
render=function(){ window.__sheet = (S.s07==='h'); _render(); decorate(); };
function toggleMotion(){ MOTION=!MOTION;
  document.getElementById('btnMotion').textContent = MOTION?'모션 끄기':'모션 켜기'; render(); }
function replay(){ render();
  document.getElementById('phone').scrollIntoView({behavior:'smooth',block:'start'}); }

buildControls(); render();
</script>
