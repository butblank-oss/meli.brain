async function imgPut(k,arr){IMG[k]=arr;try{const d=await idb();await new Promise(ok=>{const t=d.transaction('s','readwrite');t.objectStore('s').put(arr,k);t.oncomplete=ok;t.onerror=ok})}catch(e){toast('이 브라우저에서는 스크린샷을 저장할 수 없어 새로고침하면 사라집니다')}}
async function loadAll(){const keys=[...D.tc.map(t=>t.id),...D.bugs.map(b=>b.id),...Object.keys(S.auto)];for(const k of keys)IMG[k]=await imgGet(k)}
function shrink(file){return new Promise(ok=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=1280,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.86))};im.onerror=()=>ok(null);im.src=fr.result};fr.readAsDataURL(file)})}
async function addFiles(k,files){const imgs=[...files].filter(f=>f.type.startsWith('image/'));if(!imgs.length)return;const arr=IMG[k]||[];for(const f of imgs){const u=await shrink(f);if(u)arr.push(u)}await imgPut(k,arr);paintDrop(k);toast(`${k}에 스크린샷 ${imgs.length}장 추가`)}
const drop=k=>`<div class="drop" tabindex="0" data-drop="${k}"><b>증빙 스크린샷</b> — 이 칸을 누른 뒤 <b>Ctrl+V</b>로 붙여넣기 · 끌어놓기 · <label class="pick">파일 선택<input type="file" accept="image/*" multiple hidden data-file="${k}"></label><div class="ups" id="ups-${k}"></div></div>`;
function paintDrop(k){const el=document.getElementById('ups-'+k);if(!el)return;el.innerHTML=(IMG[k]||[]).map((u,i)=>`<div class="up"><img src="${u}" onclick="zoomIt(this.src)" alt="${k} 스크린샷 ${i+1}"><button title="삭제" data-del="${k}" data-i="${i}">✕</button></div>`).join('')}
let lastDrop=null;
document.addEventListener('focusin',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d)lastDrop=d.dataset.drop});
document.addEventListener('paste',e=>{const d=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('[data-drop]');const k=d?d.dataset.drop:lastDrop;if(!k)return;const f=[...(e.clipboardData||{}).files||[]];if(f.length){e.preventDefault();addFiles(k,f)}});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(!d)return;e.preventDefault();d.classList.remove('over');addFiles(d.dataset.drop,e.dataTransfer.files)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.file){addFiles(el.dataset.file,el.files);el.value=''}else if(el.tagName==='SELECT'&&el.dataset.f){rec(el.dataset.id)[el.dataset.f]=el.value;save();stats()}});

const allBugIds=()=>[...D.bugs.map(b=>b.id),...Object.keys(S.auto)];
const nextId=()=>'BUG-'+String(Math.max(0,...allBugIds().map(x=>+x.replace(/\D/g,'')))+1).padStart(2,'0');

function onResult(tid){const t=D.tc.find(x=>x.id===tid),s=g(tid),failed=s.a==='실패'||s.i==='실패';
 const mine=Object.keys(S.auto).find(k=>S.auto[k].tc===tid);
 if(failed&&!mine){const kb=known(tid);
   if(kb.length&&!s.forceNew){s.bug=kb.join(', ');toast(`${tid}는 기존 ${s.bug}와 연결했습니다. 다른 문제면 결함 탭에서 [새 결함] 버튼`);return}
   const id=nextId();S.auto[id]={tc:tid,title:`${t.scr} — 기대 결과와 다름`,pr:t.pr,sev:SEV[t.pr],status:'개발 수정',env:[s.a==='실패'?'Android':'',s.i==='실패'?'iOS':''].filter(Boolean).join(' · '),created:new Date().toISOString().slice(0,10)};
   s.bug=[...(s.bug?[s.bug]:[]),id].join(', ');toast(`${id} 자동 생성 — 결함 탭에서 제목만 다듬으세요`)}
 else if(!failed&&mine&&!S.auto[mine].edited){delete S.auto[mine];s.bug=(s.bug||'').split(', ').filter(x=>x&&x!==mine).join(', ');toast(`${mine} 삭제 (실패 해제)`)}
 else if(failed&&mine){S.auto[mine].env=[s.a==='실패'?'Android':'',s.i==='실패'?'iOS':''].filter(Boolean).join(' · ')}}
